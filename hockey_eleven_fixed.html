<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Hockey Eleven — Prototype</title>
<style>
:root{--bg:#050a13;--panel:#0b1422;--panel2:#101d2e;--line:#1e3a58;--blue:#16a9ff;--blue2:#0875d1;--text:#eaf5ff;--muted:#8ea5bc;--green:#35d07f;--red:#ff4e63;--gold:#ffc83d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#12395b 0,#07111e 38%,#03070d 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button{font:inherit;color:inherit}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#050b14;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh}.logo{font-size:22px;font-weight:900;letter-spacing:-1px;margin:0 8px 5px}.tag{font-size:9px;color:#69bfff;letter-spacing:2px;margin:0 8px 20px}.club{background:linear-gradient(135deg,#102945,#081421);border:1px solid #214667;border-radius:14px;padding:13px;margin-bottom:16px}.club b{font-size:15px}.club small{display:block;color:var(--muted);margin-top:3px}.nav{display:grid;gap:7px}.nav button{background:transparent;border:1px solid transparent;padding:11px 12px;border-radius:9px;text-align:left;cursor:pointer;color:#b9c9d8}.nav button:hover,.nav button.active{background:#0d2740;border-color:#165b8a;color:white}.main{padding:18px;overflow:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.title h1{margin:0;font-size:26px}.title p{margin:4px 0;color:var(--muted);font-size:13px}.wallet{display:flex;gap:9px}.pill{background:#0b1b2d;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.card{background:linear-gradient(145deg,rgba(15,31,49,.96),rgba(6,15,25,.98));border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 10px 35px #0004}.hero{grid-column:span 8;min-height:220px;position:relative;overflow:hidden;background:linear-gradient(120deg,#0b2943,#07101b 62%),url('');}.hero:after{content:'🏒';position:absolute;right:45px;bottom:-35px;font-size:190px;opacity:.08;transform:rotate(-15deg)}.hero h2{font-size:38px;margin:8px 0}.hero .slogan{color:#72c9ff;font-weight:800}.stat{grid-column:span 4}.stat .big{font-size:32px;font-weight:900;margin:6px 0}.cards4{grid-column:span 12;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.mini{min-height:110px}.mini b{font-size:18px}.muted{color:var(--muted)}.btn{background:linear-gradient(135deg,#16a9ff,#0875d1);border:0;border-radius:9px;padding:10px 14px;font-weight:900;cursor:pointer;box-shadow:0 5px 18px #078df044}.btn.secondary{background:#0b1b2b;border:1px solid #245273}.btn.danger{background:#631a29}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.section-title{font-size:18px;font-weight:900;margin-bottom:10px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th{color:#7792aa;text-align:left;padding:8px;border-bottom:1px solid var(--line)}.table td{padding:9px 8px;border-bottom:1px solid #173047}.table tr.me{background:#0c3150}.form{display:flex;gap:3px}.dot{width:10px;height:10px;border-radius:2px;display:inline-block}.w{background:var(--green)}.d{background:var(--gold)}.l{background:var(--red)}.bar{height:7px;background:#10263a;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#0875d1,#27c4ff)}
/* team */.roster{grid-column:span 8}.lineup{grid-column:span 4}.player{display:grid;grid-template-columns:36px 1fr 45px 55px;gap:8px;align-items:center;padding:9px;border-bottom:1px solid #173047}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#24557a,#0b1725);font-weight:900}.ovr{font-weight:900}.tagpos{font-size:10px;color:#69bfff}.ice{height:310px;border-radius:14px;background:radial-gradient(ellipse at center,#dff7ff 0,#a9e8ff 36%,#4da9d3 37%,#bdefff 38%,#dff8ff 100%);position:relative;overflow:hidden;border:4px solid #c7f5ff;box-shadow:inset 0 0 50px #0875d155}.zone{position:absolute;top:0;bottom:0;width:2px;background:#e74c3c55;left:50%}.net{position:absolute;width:75px;height:34px;border:4px solid #e33b49;border-bottom:0;left:calc(50% - 37px);top:18px}.playerdot{position:absolute;width:42px;height:42px;border-radius:50%;background:#0c3555;color:white;display:grid;place-items:center;border:3px solid #fff;font-weight:900}.p1{left:50%;top:72px}.p2{left:22%;top:135px}.p3{right:22%;top:135px}.p4{left:37%;top:210px}.p5{right:37%;top:210px}.goalie{left:calc(50% - 21px);bottom:22px}.bench{margin-top:9px;color:var(--muted);font-size:11px}
/* match */.scoreboard{grid-column:span 12;text-align:center;padding:18px;background:linear-gradient(145deg,#0b2740,#060f19);border:1px solid #25557b;border-radius:15px}.score{font-size:58px;font-weight:1000;letter-spacing:4px}.teams{display:flex;justify-content:center;align-items:center;gap:30px;font-size:18px;font-weight:900}.period{color:#66c7ff;font-weight:800}.matchlog{grid-column:span 7;max-height:360px;overflow:auto}.controls{grid-column:span 5}.event{padding:9px;border-bottom:1px solid #173047;font-size:12px}.event strong{color:#fff}.event .time{color:#62c8ff;font-weight:900;margin-right:8px}.tactic{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin:10px 0}.tactic button{padding:9px;background:#0a1b2c;border:1px solid #244763;border-radius:8px;cursor:pointer}.tactic button.sel{border-color:#19b1ff;background:#0c3150}.meter{margin:12px 0}.meter .row{font-size:11px;color:var(--muted);margin-bottom:4px}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px}.logo,.tag,.club{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.main{padding:10px}.hero,.stat,.roster,.lineup,.matchlog,.controls{grid-column:span 12}.cards4{grid-template-columns:1fr 1fr}.score{font-size:42px}}
</style>
</head>
<body><div class="app"><aside class="side"><div class="logo">HOCKEY ELEVEN</div><div class="tag">BUILD • MANAGE • DOMINATE</div><div class="club"><b>🐺 HC VARGAN</b><small>1. liga • skupina A</small><small>Manažer: Jirka</small></div><div class="nav" id="nav"></div></aside><main class="main" id="main"></main></div>
<script>
const teams=[['HC Vargan',57],['Northfire HC',53],['Falconis',50],['Redforge HC',46],['Iron Bears',44],['Dravion HC',40],['Foxen',42],['Stormguard HC',39],['Lioncrest',37],['Frostvale HC',34],['Scorvia',31],['Mountaris',29],['Wildboar HC',24],['Blackridge',23],['Voltrix HC',19],['Averon HC',13]];
const players=[
['Jakub Novotný','C',85],['David Dvořák','LW',83],['Adam Růžička','RW',82],['Petr Marek','G',84],['Tomáš Černý','RD',81],['Martin Kovář','LD',80],['Lukáš Veselý','RW',78],['Matěj Horák','LW',77],['Jan Malý','C',76],['Ondřej Svoboda','RD',75],['Pavel Bláha','LD',74],['Marek Král','G',73]];
let state={page:'home',home:0,away:0,period:1,clock:0,running:false,tactic:'Vyvážená',events:[]};
const nav=[['home','🏠 Domů'],['league','🏆 Liga'],['team','👥 Tým'],['match','🏒 Zápas'],['training','🏋️ Trénink'],['scouting','🔎 Skauting'],['transfers','↔️ Přestupy'],['stadium','🏟️ Stadion'],['economy','💰 Ekonomika'],['academy','👶 Akademie'],['calendar','📅 Kalendář'],['history','📜 Historie']];
function money(n){return n.toLocaleString('cs-CZ')+' Kč'}
function renderNav(){document.getElementById('nav').innerHTML=nav.map(([id,label])=>`<button class="${state.page===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('')}
function go(p){state.page=p;render();}
function card(title,body,cls=''){return `<section class="card ${cls}"><div class="section-title">${title}</div>${body}</section>`}
function home(){return `<div class="top"><div class="title"><h1>HC VARGAN</h1><p>1. liga • skupina A • sezóna 2026/27</p></div><div class="wallet"><div class="pill">💰 42 650 000 Kč</div><div class="pill">🪙 1 250</div></div></div><div class="grid">${card('🏒 HC VARGAN',`<h2>Tvůj klub. Tvoje cesta.</h2><div class="slogan">SÍLA • VYTRVALOST • JEDEN CÍL</div><br><button class="btn" onclick="go('match')">▶ Spustit další zápas</button>`,`hero`)}${card('📊 Aktuální forma',`<div class="big">82 OVR</div><div class="muted">Forma 91 • Kondice 94 • Morálka 88</div><br><div class="bar"><span style="width:82%"></span></div>`,`stat`)}<div class="cards4">${[['🏆 Liga','2. místo','league'],['🏋️ Trénink','6 hráčů připraveno','training'],['🔎 Skauting','2 nové zprávy','scouting'],['↔️ Přestupy','3 nabídky','transfers']].map(x=>`<div class="card mini" onclick="go('${x[2]}')"><div class="muted">${x[0]}</div><b>${x[1]}</b><br><br><button class="btn secondary">Otevřít</button></div>`).join('')}</div>${card('📅 Další zápas',`<div class="teams"><span>🐺 HC VARGAN</span><b>VS</b><span>🦊 FOXEN</span></div><p class="muted" style="text-align:center">Zítra • 18:00 • Vargan Arena</p>`)}</div>`}
function league(){return `<div class="top"><div class="title"><h1>🏆 Liga</h1><p>1. liga • Skupina A</p></div><button class="btn" onclick="go('match')">Další zápas →</button></div><div class="grid">${card('TABULKA',`<table class="table"><tr><th>#</th><th>Klub</th><th>Z</th><th>V</th><th>VB</th><th>P</th><th>B</th></tr>${teams.map((t,i)=>`<tr class="${i===0?'me':''}"><td>${i+1}</td><td>${t[0]}</td><td>22</td><td>${Math.max(3,16-i)}</td><td>${i%4}</td><td>${i+1}</td><td><b>${t[1]}</b></td></tr>`).join('')}</table>`,`roster`)}${card('📈 FORMA HC VARGAN',`<div class="form">${'WWDWWWWD'.split('').map(x=>`<span class="dot ${x==='W'?'w':x==='D'?'d':'l'}"></span>`).join('')}</div><br><p>Posledních 5: <b>4 výhry</b>, 1 remíza</p><button class="btn secondary">Zobrazit statistiky</button>`,`lineup`)}</div>`}
function team(){return `<div class="top"><div class="title"><h1>👥 Soupiska</h1><p>HC Vargan • nejlepší dostupná sestava</p></div><button class="btn" onclick="autoLineup()">⚡ Automatické přiřazení</button></div><div class="grid">${card('HRÁČI',players.map((p,i)=>`<div class="player"><div class="avatar">${p[0][0]}</div><div><b>${p[0]}</b><div class="tagpos">${p[1]}</div></div><div class="ovr">${p[2]}</div><div class="muted">${i<6?'1. lajna':'rotace'}</div></div>`).join(''), 'roster')}${card('FORMACE',`<div class="ice"><div class="zone"></div><div class="net"></div><div class="playerdot p1">85</div><div class="playerdot p2">83</div><div class="playerdot p3">82</div><div class="playerdot p4">81</div><div class="playerdot p5">80</div><div class="playerdot goalie">84</div></div><p class="bench">Chemie lajny: <b>86%</b> • Obrana: <b>79</b> • Brankář: <b>84</b></p>`,'lineup')}</div>`}
function autoLineup(){alert('Automatické přiřazení dokončeno: nejlepší dostupné lajny, obranné dvojice a brankář byli vybráni podle OVR, formy a kondice.');}
function match(){let total=300;let sec=Math.min(state.clock,total);let min=Math.floor(sec/60),s=String(sec%60).padStart(2,'0');return `<div class="top"><div class="title"><h1>🏒 LIVE ZÁPAS</h1><p>1. liga • Vargan Arena • ${state.tactic}</p></div><button class="btn" onclick="startMatch()">${state.running?'ZÁPAS BĚŽÍ':'▶ SPUSTIT ZÁPAS'}</button></div><div class="grid">${card('HC VARGAN  vs  FOXEN',`<div class="teams"><span>🐺 HC VARGAN</span><b class="score">${state.home} : ${state.away}</b><span>🦊 FOXEN</span></div><div class="period">${state.period}. TŘETINA • ${min}:${s}</div>`,`scoreboard`)}${card('PRŮBĚH ZÁPASU',state.events.length?state.events.slice().reverse().map(e=>`<div class="event"><span class="time">${e.time}</span>${e.text}</div>`).join(''):'<p class="muted">Zápas ještě nezačal.</p>','matchlog')}${card('TAKTIKA',`<div class="tactic">${['Defenzivní','Vyvážená','Ofenzivní'].map(t=>`<button class="${state.tactic===t?'sel':''}" onclick="setTactic('${t}')">${t}</button>`).join('')}</div><div class="meter"><div class="row"><span>Tempo</span><b>${state.tactic==='Ofenzivní'?'92':'78'}%</b></div><div class="bar"><span style="width:${state.tactic==='Ofenzivní'?92:78}%"></span></div></div><p class="muted">Zápas běží automaticky. Můžeš reagovat změnou taktiky.</p>`,'controls')}</div>`}
function setTactic(t){state.tactic=t;render()}
function startMatch(){if(state.running)return;state.running=true;state.home=0;state.away=0;state.clock=0;state.period=1;state.events=[];render();let timer=setInterval(()=>{state.clock+=1;if(Math.random()<0.045){let home=Math.random() < (state.tactic==='Ofenzivní'?0.62:state.tactic==='Defenzivní'?0.48:0.56);let type=Math.random();let txt='';if(type<0.55){home?state.home++:state.away++;txt=`🥅 GÓL — ${home?'Novotný':'Foxen'}! ${state.home}:${state.away}`;}else if(type<0.78)txt=`🟦 Vyloučení — ${home?'Foxen':'HC Vargan'}, 2 min` ;else txt=`🔥 Velká šance — ${home?'Vargan':'Foxen'}! Brankář zasahuje.`;state.events.push({time:`${Math.floor(state.clock/60)}:${String(state.clock%60).padStart(2,'0')}`,text:txt});} if(state.clock===100||state.clock===200){state.period++;} if(state.clock>=300){clearInterval(timer);state.running=false;state.events.push({time:'KONEC',text:`🏁 Konec zápasu — HC Vargan ${state.home}:${state.away} Foxen.`});}render();},1000)}
function simple(title,text){return `<div class="top"><div class="title"><h1>${title}</h1><p>HC Vargan • Hockey Eleven</p></div></div><div class="grid">${card(title,text,'roster')}${card('📌 Přehled','<p class="muted">Tato část prototypu je připravená pro další rozšíření systému.</p><button class="btn secondary" onclick="go('home')">← Zpět domů</button>','lineup')}</div>`}
function page(){switch(state.page){case'home':return home();case'league':return league();case'team':return team();case'match':return match();case'training':return simple('🏋️ Trénink','Střelba • Přihrávky • Bruslení • Obrana • Kondice • Herní myšlení');case'scouting':return simple('🔎 Skauting','Hledat podle pozice, věku, OVR, potenciálu a ceny.');case'transfers':return simple('↔️ Přestupy','Přestupový trh • nabídky • vyjednávání • sledovaní hráči');case'stadium':return simple('🏟️ Stadion','Vargan Arena • Kapacita 17 200 • Úroveň 6');case'economy':return simple('💰 Ekonomika',`Zůstatek: <b>${money(42650000)}</b><br><br>Příjmy: +12 400 000 Kč<br>Výdaje: −8 750 000 Kč`);case'academy':return simple('👶 Akademie','Nejlepší talent: Tomáš Beneš • 17 let • OVR 66 • potenciál ★★★★★');case'calendar':return simple('📅 Kalendář','Zítra: Foxen (D) • 18:00<br>Za 4 dny: Trénink<br>Za 7 dní: Český pohár');case'history':return simple('📜 Historie','2026 — HC Vargan • 2. místo v lize<br>2025 — Postup do 1. ligy');}}
function render(){renderNav();document.getElementById('main').innerHTML=page()}
render();
</script></body></html>
