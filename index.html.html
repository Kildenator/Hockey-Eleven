<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b14">
<title>Hockey Eleven</title>
<style>
:root{--bg:#040914;--panel:#081522e8;--panel2:#0b1d2ee8;--line:#173a5a;--blue:#087cff;--blue2:#22a6ff;--text:#f4f8fc;--muted:#8299ad;--green:#38e58a;--red:#ff5d63;--gold:#ffc928}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#020711;color:var(--text);overflow:hidden}button{font:inherit;color:inherit}
.app{width:100vw;height:100vh;min-height:430px;background:radial-gradient(circle at 55% -15%,#16456d 0,#07182a 38%,#030812 78%);display:grid;grid-template-columns:205px 1fr;grid-template-rows:76px 1fr;position:relative;overflow:hidden}
.app:before{content:"";position:absolute;inset:76px 0 0 205px;background:linear-gradient(180deg,#06132166,#020711cc),radial-gradient(ellipse at 52% 18%,#1e537944,#02071100 55%);pointer-events:none}
.top{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;padding:10px 22px;border-bottom:1px solid #17314b;background:#030b15e8;backdrop-filter:blur(16px);z-index:20}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:46px;height:52px;clip-path:polygon(50% 0,92% 14%,92% 68%,50% 100%,8% 68%,8% 14%);background:linear-gradient(160deg,#eaf7ff,#0d8cff);display:grid;place-items:center;color:#061321;font-weight:1000;font-size:22px}.brand-title{font-weight:1000;letter-spacing:.07em;font-size:20px;line-height:1}.brand-title span{color:#1495ff}.club{margin-left:25px;border-left:1px solid #1c3a53;padding-left:25px}.club b{display:block;font-size:16px}.club small{color:var(--muted)}.top-right{display:flex;gap:10px;align-items:center}.top-pill{min-width:145px;border:1px solid #1b3d5c;background:#071728;border-radius:13px;padding:7px 12px}.top-pill small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.top-pill strong{font-size:14px}.green{color:var(--green)}.gear{width:42px;height:42px;border:1px solid #1b3d5c;background:#071728;border-radius:12px;font-size:20px}
.side{z-index:10;border-right:1px solid #17314b;background:linear-gradient(180deg,#06111deF,#030a12f2);padding:16px 10px;display:flex;flex-direction:column;gap:5px}.navbtn{border:1px solid transparent;background:transparent;border-radius:11px;padding:10px 12px;display:flex;align-items:center;gap:12px;text-align:left;color:#91a7ba;cursor:pointer;font-weight:700}.navbtn:hover{background:#0a1c2c;color:white}.navbtn.active{background:linear-gradient(90deg,#087cff,#0759b8);border-color:#2ca8ff66;color:white;box-shadow:0 0 25px #087cff44}.navicon{width:24px;text-align:center;font-size:19px}.side-bottom{margin-top:auto;border-top:1px solid #17314b;padding-top:12px}
.main{z-index:2;padding:18px;overflow:auto;scrollbar-width:none}.main::-webkit-scrollbar{display:none}.dashboard{display:grid;grid-template-columns:minmax(430px,1.55fr) minmax(280px,.75fr);gap:14px;max-width:1500px;margin:auto}.hero{height:355px;border:1px solid #1b4d76;border-radius:18px;overflow:hidden;position:relative;background:linear-gradient(180deg,#0a2944aa,#061321ee),radial-gradient(ellipse at 50% 45%,#1e679455,#020812 72%);box-shadow:0 18px 60px #0009}.arena-lights{position:absolute;inset:0;background:radial-gradient(circle at 14% 10%,#fff8 0 2%,transparent 9%),radial-gradient(circle at 86% 10%,#fff8 0 2%,transparent 9%),repeating-linear-gradient(120deg,transparent 0 70px,#6dc8ff08 71px 73px);opacity:.9}.rink{position:absolute;left:7%;right:7%;bottom:-9%;height:52%;border-radius:50% 50% 8% 8%;background:linear-gradient(#dff5ff,#91bfd8);border:8px solid #50758d;box-shadow:0 -40px 70px #55bfff33}.rink:after{content:"VARGAN";position:absolute;inset:30% 0 auto;text-align:center;font-size:44px;font-weight:1000;letter-spacing:.12em;color:#087cff44;transform:skewX(-12deg)}.hero-content{position:absolute;inset:0;padding:22px;display:flex;flex-direction:column}.eyebrow{font-size:12px;color:#a8c9e2;font-weight:800;letter-spacing:.1em}.hero h1{margin:3px 0 0;font-size:18px}.versus{margin:auto;display:grid;grid-template-columns:1fr 100px 1fr;align-items:center;text-align:center;width:88%}.team{font-weight:1000;font-size:21px}.logo{width:76px;height:76px;margin:0 auto 8px;border-radius:22px;background:linear-gradient(145deg,#f8fcff,#237dce);display:grid;place-items:center;color:#071526;font-size:42px;box-shadow:0 8px 30px #0008}.logo.away{background:linear-gradient(145deg,#ffef72,#ff4a22)}.vs{font-size:28px;font-weight:1000;color:white}.date{font-size:13px;color:#bdd2e2;margin-top:5px}.start{align-self:center;border:0;border-radius:13px;padding:13px 34px;background:linear-gradient(90deg,#087cff,#00a4ff);box-shadow:0 8px 30px #087cff55;font-weight:1000;cursor:pointer}.start:hover{filter:brightness(1.1)}
.panel{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#0b1c2ceF,#06111ceF);box-shadow:0 12px 35px #0007;overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:15px 17px;border-bottom:1px solid #16344d}.panel-head h2{font-size:15px;margin:0}.link{color:#3eaaff;font-size:12px}.standings{height:355px}.standings table{width:100%;border-collapse:collapse;font-size:12px}.standings th,.standings td{padding:9px 12px;border-bottom:1px solid #112b40;text-align:left}.standings th{color:#6e879b;font-size:10px;text-transform:uppercase}.standings tr:first-child{background:#087cff20}.rank{width:22px;color:#a9bfd0}.points{color:var(--green);font-weight:900}.finance{margin-top:14px;padding:15px 17px}.money{font-size:24px;font-weight:1000;color:var(--green)}.finance-row{display:flex;justify-content:space-between;padding-top:8px;color:#9ab0c0;font-size:12px}.finance-row b{color:#eaf3f8}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}.action{min-height:115px;padding:17px;position:relative;overflow:hidden;cursor:pointer;transition:.15s}.action:hover{transform:translateY(-2px);border-color:#2588c9}.action:after{content:"";position:absolute;right:-35px;bottom:-50px;width:160px;height:160px;background:radial-gradient(circle,#168cff35,transparent 68%);pointer-events:none}.action-icon{font-size:29px;margin-bottom:7px}.action h3{margin:0 0 5px;font-size:15px}.action p{margin:0;color:#8199ac;font-size:11px;line-height:1.4}.page-title{max-width:1500px;margin:0 auto 14px}.page-title h1{margin:0;font-size:25px}.page-title p{margin:4px 0;color:var(--muted);font-size:12px}.section-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:1500px;margin:auto}.player-list,.feature{padding:0}.player{display:flex;align-items:center;gap:12px;padding:12px 15px;border-bottom:1px solid #132e43}.avatar{width:42px;height:42px;border-radius:12px;background:linear-gradient(145deg,#193b58,#0a1827);display:grid;place-items:center;font-weight:900}.player-info{flex:1}.player-info b{font-size:13px}.player-info small{display:block;color:var(--muted);margin-top:2px}.ovr{font-size:20px;font-weight:1000;color:#55d9ff}.mini-bar{width:55px;height:5px;background:#10273a;border-radius:99px;overflow:hidden}.mini-bar i{display:block;height:100%;background:var(--green);border-radius:99px}.tabs{display:flex;gap:7px;margin-bottom:12px}.tab{border:1px solid #1b3d59;background:#081a2a;border-radius:9px;padding:8px 12px;font-size:11px;color:#8ea8bb}.tab.active{background:#087cff;color:#fff;border-color:#2ca8ff}.action-btn{border:0;border-radius:9px;padding:8px 11px;background:#087cff;font-weight:800;font-size:11px;cursor:pointer}.ghost{background:#122b40}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:11px 17px;border-radius:11px;border:1px solid #2a9eff;background:#09253b;box-shadow:0 10px 35px #000b;z-index:99;font-weight:700;font-size:12px}
@media(max-width:900px){.app{grid-template-columns:76px 1fr}.app:before{left:76px}.brand-title,.club,.top-pill{display:none}.side{padding:12px 8px}.navbtn{justify-content:center;padding:11px}.navbtn span:last-child{display:none}.navicon{font-size:21px}.top{padding:9px 13px}.dashboard{grid-template-columns:1fr}.standings{height:auto}.hero{height:320px}.cards{grid-template-columns:repeat(2,1fr)}.section-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){html,body{min-width:760px}.app{min-width:760px}.main{padding:12px}.cards{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><div class="brand-mark">🏒</div><div class="brand-title">HOCKEY <span>ELEVEN</span></div><div class="club"><b>HC VARGAN</b><small>1. liga • 12–6–3 • 32 bodů</small></div></div>
  <div class="top-right"><div class="top-pill"><small>Klubová kasa</small><strong>2 450 000 Kč <span class="green">+480k</span></strong></div><div class="top-pill"><small>1. liga</small><strong>🏆 1. místo</strong></div><div class="top-pill"><small>Další zápas</small><strong>12. 10. • 18:00</strong></div><button class="gear" onclick="toast('Nastavení bude brzy dostupné')">⚙️</button></div>
</header>
<aside class="side" id="side"></aside>
<main class="main" id="main"></main>
</div>
<script>
'use strict';
const nav=[['home','⌂','Domů'],['team','👥','Tým'],['match','▣','Zápasy'],['league','🏆','Liga'],['finance','◉','Finance'],['stadium','🏟','Stadion'],['training','⚡','Trénink'],['tactics','⚔','Taktika'],['scout','⌕','Scouting'],['transfers','⇄','Přestupy'],['facilities','▦','Zařízení']];
const state={page:'home',running:false,sec:0,home:0,away:0,period:1,tactic:'balanced',events:[],timer:null};
const players=[['Jakub Novotný','C',85,91],['David Dvořák','LW',83,86],['Martin Kovář','RW',81,78],['Petr Svoboda','C',78,82],['Lukáš Procházka','LW',78,88],['Ondřej Němec','RW',76,75],['Filip Mareš','D',80,91],['Jan Král','D',78,84],['Adam Hájek','D',76,81],['Dominik Růžička','G',82,94]];
const teams=[['HC Vargan',32],['Northfire HC',28],['Ice Wolves',25],['Steel Bears',23],['Ravens HC',21]];
const $=id=>document.getElementById(id);
function toast(msg){const e=document.createElement('div');e.className='toast';e.textContent=msg;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
function go(p){state.page=p;render()}
function navRender(){return nav.map(n=>`<button class="navbtn ${state.page===n[0]?'active':''}" onclick="go('${n[0]}')"><span class="navicon">${n[1]}</span><span>${n[2]}</span></button>`).join('')+`<div class="side-bottom"><button class="navbtn" onclick="toast('Nastavení bude brzy dostupné')"><span class="navicon">⚙</span><span>Nastavení</span></button></div>`}
function panel(title,body,link=''){return `<section class="panel"><div class="panel-head"><h2>${title}</h2>${link?`<span class="link">${link}</span>`:''}</div>${body}</section>`}
function home(){return `<div class="dashboard"><section class="hero"><div class="arena-lights"></div><div class="rink"></div><div class="hero-content"><div class="eyebrow">DALŠÍ ZÁPAS • 1. LIGA • 12. KOLO</div><h1>Domácí zápas</h1><div class="versus"><div><div class="logo">🐺</div><div class="team">HC VARGAN</div><div class="date">12–6–3</div></div><div><div class="vs">VS</div><div class="date">12. 10. 2026<br>18:00</div></div><div><div class="logo away">🏒</div><div class="team">NORTHFIRE HC</div><div class="date">10–8–3</div></div></div><button class="start" onclick="go('match')">▶ ZAHÁJIT ZÁPAS</button></div></section><div><div class="standings">${panel('🏆 TABULKA LIGY',`<table><thead><tr><th>#</th><th>Tým</th><th>Z</th><th>V</th><th>B</th></tr></thead><tbody>${teams.map((t,i)=>`<tr><td class="rank">${i+1}</td><td><b>${t[0]}</b></td><td>21</td><td>${15-i}</td><td class="points">${t[1]}</td></tr>`).join('')}</tbody></table>`,'Zobrazit celou ligu')}</div><div class="finance">${panel('💰 FINANCE',`<div class="money">2 450 000 Kč</div><div class="finance-row"><span>Příjmy / měsíc</span><b class="green">+480 000 Kč</b></div><div class="finance-row"><span>Výdaje / měsíc</span><b style="color:var(--red)">−320 000 Kč</b></div>`,'Detail →')}</div></div></div><div class="cards">${action('👥','TÝM','Soupiska, formace a vývoj hráčů','team')}${action('⚡','TRÉNINK','Zlepšování hráčů a tréninkové plány','training')}${action('⚔','TAKTIKA','Formace a strategie zápasu','tactics')}${action('🏟','STADION','Vylepšení a zázemí','stadium')}${action('⌕','SCOUTING','Hledání talentů a sledování hráčů','scout')}${action('⇄','PŘESTUPY','Nákupy a prodeje hráčů','transfers')}</div>`}
function action(icon,title,text,page){return `<section class="panel action" onclick="go('${page}')"><div class="action-icon">${icon}</div><h3>${title}</h3><p>${text}</p></section>`}
function title(t,s){return `<div class="page-title"><h1>${t}</h1><p>${s}</p></div>`}
function team(){return title('Tým','Soupiska, formace a automatické přiřazení')+`<div class="section-grid">${panel('SOUPISKA',`<div class="tabs"><button class="tab active">Všichni 23</button><button class="tab">Útočníci</button><button class="tab">Obránci</button><button class="tab">Brankáři</button></div><div class="player-list">${players.map(p=>`<div class="player"><div class="avatar">${p[0].split(' ').map(x=>x[0]).join('')}</div><div class="player-info"><b>${p[0]}</b><small>${p[1]} • ${p[3]}% forma</small></div><div class="mini-bar"><i style="width:${p[3]}%"></i></div><div class="ovr">${p[2]}</div></div>`).join('')}</div>`,'Formace →')}${panel('DOPORUČENÁ SESTAVA',`<div class="player"><div class="avatar">57</div><div class="player-info"><b>1. lajna</b><small>Novotný • Dvořák • Kovář</small></div><b class="green">92%</b></div><div class="player"><div class="avatar">18</div><div class="player-info"><b>2. lajna</b><small>Svoboda • Procházka • Němec</small></div><b class="green">86%</b></div><button class="action-btn" onclick="toast('Automatické přiřazení dokončeno')">⚡ Automatické přiřazení</button>`,'Upravit →')}${panel('JAKUB NOVOTNÝ',`<div style="padding:17px"><div class="money" style="color:#55d9ff">85 OVR</div><div class="finance-row"><span>Střelba</span><b>88</b></div><div class="finance-row"><span>Přihrávky</span><b>84</b></div><div class="finance-row"><span>Rychlost</span><b>86</b></div><div class="finance-row"><span>Bránění</span><b>80</b></div><br><button class="action-btn" onclick="toast('Detail hráče')">Otevřít profil</button></div>`,'Profil →')}</div>`}
function training(){return title('Trénink','Denní rozvoj hráčů, kondice a týmová chemie')+`<div class="section-grid">${[['🎯','STŘELBA','+ zakončení • −4 kondice'],['⚡','KONDICE','+ bruslení • −6 kondice'],['🛡','OBRANA','+ poziční hra • −4 kondice'],['💪','SÍLA','+ souboje • −5 kondice'],['🤝','TÝM','+ chemie lajny • −2 kondice'],['🥅','SPEC. TÝMY','+ PP / PK • −3 kondice']].map(x=>panel(x[0]+'  '+x[1],`<div style="padding:17px"><p style="color:var(--muted);font-size:12px">${x[2]}</p><button class="action-btn" onclick="toast('Trénink naplánován')">NAPLÁNOVAT</button></div>`)).join('')}</div>`}
function league(){return title('Liga','1. liga • Skupina 184 • 14 klubů')+`<div class="section-grid">${panel('TABULKA',`<table class="standings"><tbody>${teams.map((t,i)=>`<tr><td>${i+1}</td><td><b>${t[0]}</b></td><td>21</td><td>${t[1]}</td></tr>`).join('')}</tbody></table>`)}${panel('SEZÓNA',`<div style="padding:17px"><div class="money" style="color:#55d9ff">1. místo</div><p style="color:var(--muted);font-size:12px">Cíl vedení: vyhrát základní část a postoupit do finále play-off.</p><button class="action-btn" onclick="toast('Kalendář otevřen')">KALENDÁŘ</button></div>`)}${panel('POŘADÍ SKUPINY',`<div style="padding:17px"><div class="finance-row"><span>Postup do play-off</span><b class="green">ANO</b></div><div class="finance-row"><span>Evropský pohár</span><b>3. místo+</b></div><div class="finance-row"><span>Sestup</span><b style="color:var(--red)">13.–14.</b></div></div>`)}</div>`}
function generic(name,sub,items){return title(name,sub)+`<div class="section-grid">${items.map(x=>panel(x[0],`<div style="padding:17px"><div class="money" style="color:${x[2]||'#55d9ff'}">${x[1]}</div><p style="color:var(--muted);font-size:12px">${x[3]}</p><button class="action-btn" onclick="toast('${x[4]||'Hotovo'}')">${x[5]||'OTEVŘÍT'}</button></div>`)).join('')}</div>`}
function match(){const m=Math.floor(state.sec/60),s=String(state.sec%60).padStart(2,'0');return title('Živý zápas','Serverová simulace • zápas pokračuje i po zavření aplikace')+`<div class="dashboard"><section class="hero" style="height:330px"><div class="arena-lights"></div><div class="rink"></div><div class="hero-content"><div class="eyebrow">${state.period}. TŘETINA • ${m}:${s}</div><div class="versus"><div><div class="logo">🐺</div><div class="team">HC VARGAN</div><div class="scorebig">${state.home}</div></div><div><div class="vs">VS</div><span class="badge">${state.tactic==='attacking'?'ÚTOČNÁ':state.tactic==='defensive'?'DEFENZIVNÍ':'VYVÁŽENÁ'}</span></div><div><div class="logo away">🏒</div><div class="team">NORTHFIRE HC</div><div class="scorebig">${state.away}</div></div></div><button class="start" onclick="startMatch()">${state.running?'ZÁPAS BĚŽÍ':'▶ SPUSTIT ŽIVÝ ZÁPAS'}</button></div></section><div>${panel('TAKTIKA',`<div style="padding:14px;display:flex;gap:7px"><button class="action-btn" onclick="tactic('defensive')">🛡 Obrana</button><button class="action-btn ghost" onclick="tactic('balanced')">⚖ Balanc</button><button class="action-btn" onclick="tactic('attacking')">🔥 Útok</button></div>`)}${panel('UDÁLOSTI',`<div style="padding:10px 15px">${state.events.length?state.events.slice().reverse().map(e=>`<div class="player"><span>${e}</span></div>`).join(''):'<div style="padding:15px;color:var(--muted)">Čekáme na první událost…</div>'}</div>`)}</div></div>`}
function tactics(){return generic('Taktika','Předzápasové nastavení a herní styl',[['HERNI STYL','VYVÁŽENÝ','', 'Stabilní poměr útoku a obrany.','Taktika uložena','ULOŽIT'],['FORECHECK','STŘEDNÍ','', 'Riziko vs. tlak v útočném pásmu.','Nastavení uloženo','ULOŽIT'],['TEMPO','NORMÁLNÍ','', 'Vyšší tempo zvyšuje šance i únavu.','Nastavení uloženo','ULOŽIT']])}
function finance(){return generic('Finance','Rozpočet, příjmy, výdaje a sponzoři',[['ZŮSTATEK','2 450 000 Kč','#38e58a','Aktuální klubová kasa.','Finance otevřeny','DETAIL'],['PŘÍJMY','+480 000 Kč','#38e58a','Vstupné, sponzoři a obchod.','Přehled příjmů','DETAIL'],['VÝDAJE','−320 000 Kč','#ff5d63','Mzdy, provoz a rozvoj.','Přehled výdajů','DETAIL']])}
function stadium(){return generic('Stadion','Kapacita, atmosféra, LED reklama a VIP sektory',[['VARGAN ARENA','Lv. 4','','Kapacita 8 500 • atmosféra 86.','Upgrade zahájen','VYLEPŠIT'],['LED PANELY','Lv. 3','','Více prostoru pro sponzory a zápasové efekty.','Upgrade zahájen','VYLEPŠIT'],['VIP SEKTOR','Lv. 2','','Vyšší příjem z prémiových fanoušků.','Upgrade zahájen','VYLEPŠIT']])}
function scout(){return generic('Scouting','Síť skautů a postupné odhalování potenciálu',[['MLADÝ TALENT','76 OVR','','Filip Marek • C • potenciál 88–92.','Přidán na seznam','SLEDOVAT'],['VOLNÝ HRÁČ','79 OVR','','Ondřej Koutný • G • odhad mzdy 68k.','Report objednán','SCOUT'],['SCOUTING SÍŤ','Lv. 3','','Česko, Slovensko a další regiony.','Síť rozšířena','ROZŠÍŘIT']])}
function transfers(){return generic('Přestupy','Transfer market, vyjednávání a kontrakty',[['LUKÁŠ BENEŠ','87 OVR','','LW • odhad ceny 4,2 mil. Kč.','Jednání zahájeno','VYJEDNÁVAT'],['JAN KOVÁŘ','84 OVR','','RD • odhad ceny 3,1 mil. Kč.','Jednání zahájeno','VYJEDNÁVAT'],['MAREK ZIMA','82 OVR','','C • odhad ceny 2,6 mil. Kč.','Jednání zahájeno','VYJEDNÁVAT']])}
function facilities(){return generic('Zařízení','Klubová základna a její fyzický růst',[['🏋 TRÉNINKOVÉ CENTRUM','Lv. 3','','Vývoj hráčů +8 %.','Upgrade zahájen','VYLEPŠIT'],['🏥 MEDICAL CENTRUM','Lv. 2','','Regenerace +5 % • méně zranění.','Upgrade zahájen','VYLEPŠIT'],['🧒 AKADEMIE','Lv. 3','','Lepší generace mladých talentů.','Upgrade zahájen','VYLEPŠIT']])}
function render(){ $('side').innerHTML=navRender(); const p=state.page; $('main').innerHTML=p==='home'?home():p==='team'?team():p==='training'?training():p==='league'?league():p==='match'?match():p==='tactics'?tactics():p==='finance'?finance():p==='stadium'?stadium():p==='scout'?scout():p==='transfers'?transfers():p==='facilities'?facilities():home(); }
function tactic(t){state.tactic=t;render()}
function startMatch(){if(state.running){toast('Zápas už běží');return}state.running=true;state.events.push('▶ Zápas začal. Vargan nastupuje doma.');render();state.timer=setInterval(()=>{state.sec++;if(state.sec===45)state.events.push('🏒 45′ Velká šance Varganu — brankář vyráží.');if(state.sec===90){state.home++;state.events.push('🥅 1:30 GÓL! Vargan otevírá skóre.')}if(state.sec===150)state.events.push('⚡ 2:30 Northfire zvyšuje tempo.');if(state.sec===210){state.away++;state.events.push('🥅 3:30 GÓL! Northfire srovnává.')}if(state.sec===300){state.running=false;clearInterval(state.timer);state.events.push('🏁 Konec zápasu.')}if(state.sec===100)state.period=2;if(state.sec===200)state.period=3;render()},1000)}
