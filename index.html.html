<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hockey Eleven</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#06101d;color:#eef6ff}body{overflow-x:hidden}.app{min-height:100vh;background:radial-gradient(circle at 75% 0%,#12365d 0,#08192b 36%,#040a12 100%)}
.header{height:68px;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #17334e;background:rgba(3,11,20,.82);backdrop-filter:blur(12px);position:sticky;top:0;z-index:10}.brand{font-weight:900;letter-spacing:.08em;font-size:18px}.brand span{color:#36a8ff}.resources{display:flex;gap:10px;align-items:center}.pill{padding:8px 12px;border:1px solid #234762;border-radius:12px;background:#0b2033;color:#b9d7ed;font-size:13px}.content{padding:22px;max-width:1250px;margin:auto}.nav{display:flex;gap:8px;overflow:auto;padding:12px 22px;border-bottom:1px solid #142c42;background:#06111d;position:sticky;top:68px;z-index:9}.nav button{white-space:nowrap;border:1px solid #193650;background:#0a1929;color:#a8c1d6;border-radius:10px;padding:9px 13px}.nav button.active{background:#087bd0;color:white;border-color:#1aa1ff;box-shadow:0 0 18px #087bd033}.hero{padding:26px;border:1px solid #1a3b58;border-radius:20px;background:linear-gradient(135deg,#0d2d49,#081522);box-shadow:0 20px 50px #0007;margin-bottom:18px}.hero h1{margin:0 0 6px;font-size:32px}.muted{color:#8fa9bc}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{border:1px solid #193850;background:linear-gradient(180deg,#0c1e30,#08131f);border-radius:16px;padding:17px;box-shadow:0 12px 30px #0005}.card h3{margin:0 0 12px}.stat{font-size:28px;font-weight:800}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #152c40}.row:last-child{border-bottom:0}.badge{padding:4px 8px;border-radius:8px;background:#123452;color:#75c5ff;font-size:12px}.btn{border:0;border-radius:10px;padding:10px 14px;background:#087bd0;color:#fff;font-weight:700}.btn.secondary{background:#142b40;color:#bcd7eb}.btn:active{transform:translateY(1px)}.score{display:flex;justify-content:center;align-items:center;gap:30px;text-align:center;padding:18px}.teamname{font-size:19px;font-weight:800}.scorebig{font-size:42px;font-weight:900}.event{padding:9px 0;border-bottom:1px solid #142a3e}.small{font-size:12px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #173047}.table th{color:#7591a6;font-size:12px;text-transform:uppercase}.notice{padding:12px;border-radius:12px;background:#0d2940;border:1px solid #1b557d;color:#bfe3fa}.footer{padding:30px;text-align:center;color:#577187;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}.content{padding:14px}.header{padding:10px 12px}.nav{padding:10px 12px}.hero h1{font-size:25px}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
(() => {
  'use strict';
  const teams=[
    {name:'HC Vargan',ovr:82},{name:'Northfire HC',ovr:79},{name:'Falconis',ovr:77},{name:'Redforge HC',ovr:75},
    {name:'Iron Bears',ovr:74},{name:'Dravion HC',ovr:72},{name:'Foxen',ovr:70},{name:'Stormguard HC',ovr:68}
  ];
  const players=[
    {name:'Jakub Novotný',pos:'C',ovr:85,form:91,cond:96,morale:88},
    {name:'David Dvořák',pos:'LW',ovr:83,form:86,cond:92,morale:90},
    {name:'Matěj Král',pos:'RW',ovr:81,form:78,cond:95,morale:84},
    {name:'Tomáš Vlk',pos:'LD',ovr:79,form:82,cond:89,morale:86},
    {name:'Adam Šimek',pos:'RD',ovr:78,form:88,cond:94,morale:92},
    {name:'Martin Hruška',pos:'G',ovr:84,form:93,cond:97,morale:91}
  ];
  const state={page:'home',running:false,sec:0,period:1,home:0,away:0,tactic:'balanced',events:[],timer:null};
  const nav=[['home','🏠 Domů'],['team','🏒 Tým'],['training','💪 Trénink'],['scout','🔎 Scouting'],['transfers','💰 Přestupy'],['facilities','🏟️ Klub'],['league','🏆 Liga'],['match','📺 Zápas']];
  const $=id=>document.getElementById(id);
  const money=n=>n.toLocaleString('cs-CZ')+' Kč';
  function go(page){state.page=page;render();}
  function card(title,body){return '<section class="card"><h3>'+title+'</h3>'+body+'</section>';}
  function home(){return `
    <div class="hero"><div class="muted">SEZÓNA 1 • 1. LIGA • SKUPINA 184</div><h1>Vítej zpět, manažere.</h1><div class="muted">Buduj klub, trénuj tým a veď ho na vrchol.</div></div>
    <div class="grid">
      ${card('Další zápas',`<div class="score"><div><div class="teamname">HC Vargan</div><span class="badge">DOMA</span></div><div><div class="scorebig">—</div><div class="small muted">zítra 19:00</div></div><div><div class="teamname">Northfire HC</div><span class="badge">VENKU</span></div></div><button class="btn" onclick="H.go('match')">Otevřít zápas</button>`)}
      ${card('Klubová kasa',`<div class="stat">${money(2845000)}</div><div class="muted">+ 182 000 Kč tento týden</div><br><button class="btn secondary" onclick="H.go('facilities')">Rozvoj klubu</button>`)}
      ${card('Tým',`<div class="row"><span>Průměrné OVR</span><b>82</b></div><div class="row"><span>Forma</span><b>86%</b></div><div class="row"><span>Morálka</span><b>89%</b></div><button class="btn secondary" onclick="H.go('team')">Správa sestavy</button>`)}
    </div>
    <br><div class="notice">💡 <b>Tip:</b> Automatické přiřazení sestaví nejlepší dostupné lajny podle OVR, formy a kondice.</div>`;}
  function team(){return `<div class="hero"><div class="muted">HC VARGAN</div><h1>Soupiska & sestava</h1><button class="btn" onclick="H.autoLineup()">⚡ Automatické přiřazení</button></div><div class="grid">${card('1. lajna',players.slice(0,3).map(p=>'<div class="row"><span>'+p.name+' <span class="badge">'+p.pos+'</span></span><b>'+p.ovr+'</b></div>').join(''))}${card('Obrana',players.slice(3,5).map(p=>'<div class="row"><span>'+p.name+' <span class="badge">'+p.pos+'</span></span><b>'+p.ovr+'</b></div>').join(''))}${card('Brankář',`<div class="row"><span>${players[5].name}</span><b>${players[5].ovr}</b></div><div class="muted">Kondice ${players[5].cond}% • Forma ${players[5].form}%</div>`)}</div>`;}
  function training(){return `<div class="hero"><div class="muted">KAŽDODENNÍ TRÉNINK</div><h1>Rozvoj hráčů</h1><div class="muted">Každý drill zlepšuje konkrétní atributy, ale zatěžuje kondici.</div></div><div class="grid">${[['🎯 Střelba','+ střelba, zakončení','-4 kondice'],['⚡ Kondice','+ bruslení, výdrž','-6 kondice'],['🛡️ Obrana','+ poziční hra, bloky','-4 kondice'],['💪 Síla','+ síla, souboje','-5 kondice'],['🤝 Tým','+ chemie lajny','-2 kondice'],['🥅 Speciální týmy','+ PP / PK','-3 kondice']].map(x=>card(x[0],'<div class="row"><span>'+x[1]+'</span><span class="badge">'+x[2]+'</span></div><button class="btn" onclick="H.toast(\'Trénink naplánován\')">Naplánovat</button>')).join('')}</div>`;}
  function scout(){return `<div class="hero"><div class="muted">SCOUTING NETWORK</div><h1>Scouting</h1><div class="muted">Skauti postupně odhalují potenciál a skryté vlastnosti hráčů.</div></div><div class="grid">${card('Mladý talent',`<div class="row"><span>Filip Marek • C • 19 let</span><b>76 OVR</b></div><div class="row"><span>Potenciál</span><b>88–92</b></div><button class="btn" onclick="H.toast('Hráč přidán na sledovací list')">Sledovat</button>`)}${card('Volní hráči',`<div class="row"><span>Ondřej Koutný • G</span><b>79 OVR</b></div><div class="row"><span>Odhad mzdy</span><b>68k/měs.</b></div><button class="btn" onclick="H.toast('Scout report objednán')">Scout report</button>`)}${card('Síť skautů',`<div class="row"><span>Česko</span><span class="badge">Lv. 3</span></div><div class="row"><span>Slovensko</span><span class="badge">Lv. 2</span></div><button class="btn secondary" onclick="H.toast('Rozšíření sítě bude dostupné po upgradu')">Rozšířit síť</button>`)}</div>`;}
  function transfers(){return `<div class="hero"><div class="muted">TRANSFER MARKET</div><h1>Přestupy</h1><div class="muted">Vyjednávej o přestupních částkách, mzdách a délce kontraktu.</div></div><div class="grid">${[['Lukáš Beneš','LW','87','4,2 mil.'],['Jan Kovář','RD','84','3,1 mil.'],['Marek Zima','C','82','2,6 mil.']].map(p=>card(p[0],'<div class="row"><span>'+p[1]+' • OVR</span><b>'+p[2]+'</b></div><div class="row"><span>Odhad ceny</span><b>'+p[3]+' Kč</b></div><button class="btn" onclick="H.toast(\'Jednání zahájeno\')">Vyjednávat</button>')).join('')}</div>`;}
  function facilities(){return `<div class="hero"><div class="muted">KLUBOVÁ ZÁKLADNA</div><h1>Vylepšuj svůj klub</h1><div class="muted">Budovy se fyzicky mění s každým levelem a ovlivňují ekonomiku i výkon týmu.</div></div><div class="grid">${[['🏟️ Stadion','Lv. 4','Kapacita 8 500','+ fanoušci'],['🏋️ Tréninkové centrum','Lv. 3','Vývoj +8 %','+ kondice'],['🏥 Medical centrum','Lv. 2','Regenerace +5 %','- zranění'],['🧒 Akademie','Lv. 3','Talent pool','+ potenciál'],['🔎 Scouting centrum','Lv. 3','5 skautů','+ odhalené info'],['💼 Kanceláře','Lv. 2','Finance','+ sponzoři']].map(x=>card(x[0],'<div class="row"><span>Úroveň</span><b>'+x[1]+'</b></div><div class="row"><span>'+x[2]+'</span><span class="badge">'+x[3]+'</span></div><button class="btn" onclick="H.toast(\'Upgrade zahájen\')">Vylepšit</button>')).join('')}</div>`;}
  function league(){let rows=teams.map((t,i)=>'<tr><td>'+((i+1))+'</td><td><b>'+t.name+'</b></td><td>'+t.ovr+'</td><td>'+((7-i)*3)+'</td><td>'+((7-i)+'-'+(i%3)+'-'+(i%2))+'</td></tr>').join('');return `<div class="hero"><div class="muted">1. LIGA • SKUPINA 184</div><h1>Ligová tabulka</h1><div class="muted">14 klubů, doma i venku, následně play-off.</div></div><div class="card"><table class="table"><thead><tr><th>#</th><th>Klub</th><th>OVR</th><th>Body</th><th>Bilance</th></tr></thead><tbody>${rows}</tbody></table></div>`;}
  function match(){let mins=Math.floor(state.sec/60), secs=String(state.sec%60).padStart(2,'0');return `<div class="hero"><div class="muted">ŽIVÝ ZÁPAS • ${state.period}. TŘETINA</div><h1>HC Vargan vs Northfire HC</h1><div class="score"><div><div class="teamname">HC Vargan</div><div class="scorebig">${state.home}</div></div><div><div class="muted">${mins}:${secs}</div><span class="badge">${state.tactic==='attacking'?'ÚTOČNÁ':state.tactic==='defensive'?'DEFENZIVNÍ':'VYVÁŽENÁ'}</span></div><div><div class="teamname">Northfire HC</div><div class="scorebig">${state.away}</div></div></div><button class="btn" onclick="H.startMatch()">${state.running?'ZÁPAS BĚŽÍ':'SPUSTIT ŽIVÝ ZÁPAS'}</button></div><div class="grid">${card('Taktika',`<div class="row"><button class="btn secondary" onclick="H.tactic('defensive')">🛡️ Obrana</button><button class="btn secondary" onclick="H.tactic('balanced')">⚖️ Balanc</button><button class="btn secondary" onclick="H.tactic('attacking')">🔥 Útok</button></div><div class="muted small">Změny taktiky ovlivňují šance, únavu a riziko protiútoků.</div>`)}${card('Události',state.events.length?state.events.slice().reverse().map(e=>'<div class="event">'+e+'</div>').join(''):'<div class="muted">Čekáme na první událost…</div>')}${card('Live engine',`<div class="row"><span>Match Power</span><b>82 vs 79</b></div><div class="row"><span>Domácí výhoda</span><b>+3%</b></div><div class="row"><span>Náhoda</span><b>aktivní</b></div><div class="muted small">Serverová simulace pokračuje i po zavření aplikace.</div>`)}</div>`;}
  function simple(title,text){return '<div class="hero"><div class="muted">HOCKEY ELEVEN</div><h1>'+title+'</h1><div class="muted">'+text+'</div></div>';}
  function page(){switch(state.page){case'home':return home();case'team':return team();case'training':return training();case'scout':return scout();case'transfers':return transfers();case'facilities':return facilities();case'league':return league();case'match':return match();default:return simple('Hockey Eleven','');}}
  function renderNav(){return '<div class="nav">'+nav.map(n=>'<button class="'+(state.page===n[0]?'active':'')+'" onclick="H.go(\''+n[0]+'\')">'+n[1]+'</button>').join('')+'</div>';}
  function render(){const app=$('app');if(!app)return;app.innerHTML='<header class="header"><div class="brand">HOCKEY <span>ELEVEN</span></div><div class="resources"><div class="pill">💎 1 240</div><div class="pill">💰 2,85 M</div></div></header>'+renderNav()+'<main class="content">'+page()+'</main><div class="footer">Prototype • Hockey Eleven • Fictional hockey universe</div>';}
  function toast(msg){const el=document.createElement('div');el.textContent=msg;Object.assign(el.style,{position:'fixed',bottom:'24px',left:'50%',transform:'translateX(-50%)',background:'#0b2438',border:'1px solid #268bd2',padding:'12px 18px',borderRadius:'12px',zIndex:99,boxShadow:'0 10px 30px #0008'});document.body.appendChild(el);setTimeout(()=>el.remove(),1800);}
  function autoLineup(){toast('Automatické přiřazení: nejlepší dostupná sestava nastavena');}
  function tactic(t){state.tactic=t;render();}
  function startMatch(){if(state.running){toast('Zápas už běží');return}state.running=true;state.events.push('▶️ Zápas začal. Vargan nastupuje v domácím prostředí.');render();state.timer=setInterval(()=>{state.sec++;if(state.sec===48)state.events.push('🏒 Velká šance Varganu — brankář vyráží puk.');if(state.sec===96){state.home++;state.events.push('🥅 GÓL! Vargan otevírá skóre.');}if(state.sec===150)state.events.push('⚡ Northfire zvyšuje tempo a tlačí do pásma.');if(state.sec===210){state.away++;state.events.push('🥅 GÓL! Northfire srovnává.');}if(state.sec===300){state.running=false;clearInterval(state.timer);state.events.push('🏁 Konec zápasu.');}if(state.sec===100)state.period=2;if(state.sec===200)state.period=3;render();},1000);}
  window.H={go,toast,autoLineup,tactic,startMatch};
  render();
})();
</script>
</body>
</html>
