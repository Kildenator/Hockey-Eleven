:root{
 --bg:#020813;--panel:#071727;--panel2:#0a2034;--line:#234c6b;

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#020711;color:var(--text)}

.app{

  radial-gradient(ellipse at 52% 2%,rgba(18,93,151,.22),transparent 36%),

 background:
  linear-gradient(90deg,transparent 0 19%,#e84d5842 19.3% 19.8%,transparent 20% 79%,#e84d5842 79.3% 79.8%,transparent 80%),
  radial-gradient(ellipse at center,#f6fdff 0 28%,#c5e5ef 42%,#6194ad 50%,#173d52 56%,transparent 58%);
 box-shadow:0 -24px 75px #55cfff22;
}
.scoreboard{
 background:linear-gradient(180deg,#071a2af5,#020913f2);
 border:1px solid #4489b666;
 box-shadow:0 6px 20px #0007,inset 0 1px #ffffff10;
}
.logo{
 border-radius:50%;
 background:radial-gradient(circle at 30% 20%,#fff,#b5eaff 35%,#087bca 73%,#06335b);
 box-shadow:0 0 0 4px #06203a,0 0 0 5px #4dc6ff70,0 12px 28px #000a;
}
.logo.away{
 background:radial-gradient(circle at 30% 20%,#fff8d9,#ffc15a 38%,#d94a26 74%,#642319);
 box-shadow:0 0 0 4px #28150d,0 0 0 5px #ffc05d70,0 12px 28px #000a;
}
.start,.action-btn{
 background:linear-gradient(100deg,#087bff,#099eff 70%,#24bcff);
 border:1px solid #66d0ff88;
 box-shadow:0 7px 24px #087cff35,inset 0 1px #ffffff4d;
 letter-spacing:.035em;
}
.action{
 border:1px solid #234b66;
 background:
  radial-gradient(ellipse at 100% 0,#1b70a01c,transparent 54%),
  linear-gradient(145deg,#0d2639,#06121e 76%);
 box-shadow:0 12px 28px #0007,inset 0 1px #ffffff0d;
 transition:border-color .15s,transform .15s;
}
.action:active{transform:scale(.99)}
.action-icon{color:#a8e5ff;text-shadow:0 0 17px #168cff55}
.standings tr:first-child{background:linear-gradient(90deg,#087cff24,transparent)}
.standings tr:hover,.league-table tr:hover{background:#0e3450}
.tab{transition:.15s}
.tab.active{border-color:#48baff;box-shadow:0 4px 16px #087cff2c}
.avatar,.staff-avatar{
 background:linear-gradient(145deg,#1e4b6b,#081522);
 border-color:#2b6588;
 box-shadow:inset 0 1px #ffffff12;
}
.progress i{box-shadow:0 0 12px #139dff50}
.toast{
 background:linear-gradient(145deg,#0c2d45,#061421);
 box-shadow:0 14px 40px #000b,0 0 25px #0787ff1c;
 border:1px solid #2c6282;
}
.stadium-map{
 position:relative;
 min-height:300px;
 height:clamp(310px,48vh,440px);
 border:1px solid #2c6685;
 border-radius:16px;
 overflow:hidden;
 background:
  radial-gradient(ellipse at 48% 51%,#28566a 0 11%,#112f40 12% 27%,transparent 28%),
  repeating-linear-gradient(25deg,transparent 0 28px,#b8e9ff06 29px 30px),
  linear-gradient(145deg,#0c2838,#06111c 68%,#02070d);
 box-shadow:inset 0 0 85px #000d,0 18px 45px #000a;
}
.stadium-map:before{
 inset:5%;border:1px solid #3b7b9b70;border-radius:24px;
 transform:rotate(-1.5deg);
 box-shadow:0 0 0 9px #0b243333,0 0 0 20px #06131e66,0 0 35px #138bcb20;
}
.stadium-map:after{
 background:
  linear-gradient(30deg,transparent 47%,#62cfff22 48% 48.4%,transparent 49%),
  linear-gradient(150deg,transparent 47%,#62cfff18 48% 48.4%,transparent 49%),
  radial-gradient(ellipse at 50% 50%,transparent 0 27%,#02070c66 28% 29%,transparent 30%);
}
.arena{
 width:48%;height:45%;left:26%;top:27%;border-radius:45%;
 background:
  linear-gradient(90deg,transparent 0 20%,#e34e5d55 20.5% 21%,transparent 21.5% 78.5%,#e34e5d55 79% 79.5%,transparent 80%),
  radial-gradient(ellipse at center,#f9ffff 0 39%,#d4f3ff 40% 48%,#79b7d0 49% 53%,#153e53 54% 100%);
 border:5px solid #315f73;
 box-shadow:0 0 0 9px #0b2534,0 0 65px #43c6ff3d;
 transform:rotate(-2deg);z-index:2;
}
.arena:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:#e44c5d88}
.arena:after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#2875bb99}
.building{
 backdrop-filter:blur(9px);
 background:linear-gradient(145deg,#102c40ee,#04111dec);
 border:1px solid #347aa0;
 box-shadow:0 12px 30px #0008,inset 0 1px #ffffff12;
}
.building:before{height:4px;box-shadow:0 0 15px #1aa4ff99}
.facility-card{
 background:linear-gradient(145deg,#0d2435,#050e17);
 border-color:#214a66;
 box-shadow:0 14px 38px #0008,inset 0 1px #ffffff0b;
}
.facility-art{
 background:radial-gradient(ellipse at 50% 0,#1e6892,transparent 55%),linear-gradient(145deg,#15364a,#06111b);
 border-color:#2b6282;
}
@media(max-width:1100px){
 .app{grid-template-columns:56px minmax(0,1fr)}
 .top-pill{display:none}
 .brand-title,.club{display:none}
 .main{padding:12px 12px 24px}
 .hero{height:clamp(280px,55vh,340px)}
 .stadium-map{height:clamp(285px,50vh,360px)}
}
@media(max-height:500px){
 .top{height:56px}
 .app{grid-template-rows:56px minmax(0,1fr)}
 .app:after{top:56px}
 .hero{height:280px}
 .stadium-map{height:300px}
}
@supports(padding:max(0px)){
 .top{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
 .main{padding-bottom:max(22px,env(safe-area-inset-bottom))}
}

.building:before{height:4px;box-shadow:0 0 16px #1aa4ff}

 .app{grid-template-columns:56px minmax(0,1fr)}

}

 .top{height:56px}.app{grid-template-rows:56px minmax(0,1fr)}.app:after{top:56px}

}

}

<body>
<div class="app"><header class="top"><div class="brand"><div class="brand-mark"><span>🏒</span></div><div class="brand-title">HOCKEY <span>ELEVEN</span></div><div class="club"><strong>HC VARGAN</strong><small>1. liga • sezóna 2026/27</small></div></div><div class="top-right"><div class="top-pill"><small>Klubová kasa</small><strong id="cashTop">2 450 000 Kč</strong></div><div class="top-pill"><small>Postavení</small><strong>🏆 1. místo</strong></div><div class="top-pill"><small>Další zápas</small><strong>12. 10. • 18:00</strong></div><button class="gear" onclick="toast('Nastavení a účet budou brzy dostupné')">⚙</button></div></header><aside class="side" id="side"></aside><main class="main" id="main"></main></div>
<script>

{id:1,n:'Jakub Novotný',pos:'C',ovr:85,form:91,fit:96,morale:88,pot:88,shot:88,pass:84,speed:86,def:80,role:'1. lajna'},
{id:2,n:'David Dvořák',pos:'LW',ovr:83,form:86,fit:92,morale:85,pot:87,shot:91,pass:82,speed:88,def:72,role:'1. lajna'},
{id:3,n:'Martin Kovář',pos:'RW',ovr:81,form:78,fit:90,morale:82,pot:84,shot:86,pass:81,speed:89,def:70,role:'1. lajna'},
{id:4,n:'Petr Svoboda',pos:'C',ovr:78,form:82,fit:94,morale:86,pot:82,shot:79,pass:86,speed:80,def:77,role:'2. lajna'},
{id:5,n:'Lukáš Procházka',pos:'LW',ovr:78,form:88,fit:89,morale:91,pot:90,shot:82,pass:78,speed:92,def:68,role:'2. lajna'},

{id:7,n:'Filip Mareš',pos:'D',ovr:80,form:91,fit:93,morale:89,pot:85,shot:68,pass:82,speed:78,def:92,role:'1. pár'},
{id:8,n:'Jan Král',pos:'D',ovr:78,form:84,fit:90,morale:86,pot:83,shot:65,pass:79,speed:76,def:89,role:'1. pár'},
{id:9,n:'Adam Hájek',pos:'D',ovr:76,form:81,fit:87,morale:83,pot:86,shot:61,pass:77,speed:82,def:85,role:'2. pár'},
{id:10,n:'Dominik Růžička',pos:'G',ovr:82,form:94,fit:97,morale:92,pot:87,shot:35,pass:69,speed:73,def:94,role:'Brankář'}
];
const leagueTeams=[['HC Vargan',32],['Northfire HC',28],['Ice Wolves',25],['Steel Bears',23],['Ravens HC',21],['Falconis',20],['Redforge HC',18],['Frostvale HC',17]];
const base={page:'home',cash:2450000,monthlyIn:480000,monthlyOut:320000,fan:72,reputation:61,stadiumLv:4,capacity:8500,atmosphere:86,ledLv:3,vipLv:2,trainingLv:3,medicalLv:2,academyLv:3,scoutLv:3,scoutPoints:3,tactic:'balanced',forecheck:'medium',tempo:'normal',lineupAuto:true,running:false,sec:0,home:0,away:0,period:1,events:[],timer:null,selectedPlayer:1,trainingDone:0,watchlist:[],seasonWins:12,seasonLoss:6,seasonDraws:3,day:12};
let saved={};try{saved=JSON.parse(localStorage.getItem('hockey11save')||'{}')}catch(e){}const state=Object.assign({},base,saved);state.timer=null;
const $=id=>document.getElementById(id);function save(){const x={...state,timer:null};localStorage.setItem('hockey11save',JSON.stringify(x))}function go(p){state.page=p;render()}function fmt(n){return Math.round(n).toLocaleString('cs-CZ')}function esc(s){return String(s).replaceAll("'","\\'")}function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1700)}
function navRender(){return nav.map(n=>`<button class="navbtn ${state.page===n[0]?'active':''}" onclick="go('${n[0]}')"><span class="navicon">${n[1]}</span><span>${n[2]}</span></button>`).join('')+`<div class="side-bottom"><button class="navbtn" onclick="resetSave()"><span class="navicon">↻</span><span>Nová sezóna</span></button></div>`}

function logo(type){if(type==='vargan')return `<svg viewBox="0 0 80 80"><path d="M40 6 68 16v25c0 18-11 28-28 34C23 69 12 59 12 41V16z" fill="#0b5da9" stroke="#eaf7ff" stroke-width="3"/><path d="M25 42 33 24l7 10 8-10 8 18-10-5-6 12-6-12z" fill="#fff"/></svg>`;return `<svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="29" fill="#f9b52b" stroke="#fff" stroke-width="3"/><path d="M17 40h46M25 25c10 8 20 22 30 30M55 25c-10 8-20 22-30 30" stroke="#ff5a28" stroke-width="6"/><path d="M21 54c12-6 26-6 38 0" stroke="#111b2a" stroke-width="7"/></svg>`}

function title(t,s){return `<div class="page-title"><h1>${t}</h1><p>${s}</p></div>`}
function home(){return `<div class="dashboard"><section class="hero"><div class="arena-lines"></div><div class="scoreboard">VARGAN ARENA • 18:00</div><div class="hero-content"><div class="eyebrow">DALŠÍ ZÁPAS • 1. LIGA • 12. KOLO</div><h1>Domácí zápas</h1><div class="versus"><div><div class="logo">${logo('vargan')}</div><div class="team">HC VARGAN</div><div class="record">12–6–3 • OVR 82</div></div><div><div class="vs">VS</div><div class="date">12. 10. 2026<br>18:00</div></div><div><div class="logo away">${logo('northfire')}</div><div class="team">NORTHFIRE HC</div><div class="record">10–8–3 • OVR 79</div></div></div><button class="start" onclick="go('match')">▶ ZAHÁJIT ZÁPAS</button><div class="hero-stat"><div><b>8 500</b><small>kapacita</small></div><div><b>86%</b><small>atmosféra</small></div><div><b>${state.fan}</b><small>fanoušci</small></div></div></div></section><div><div class="standings">${panel('🏆 TABULKA LIGY',`<table><thead><tr><th>#</th><th>Tým</th><th>Z</th><th>B</th></tr></thead><tbody>${leagueTeams.slice(0,5).map((t,i)=>`<tr><td class="rank">${i+1}</td><td><b>${t[0]}</b></td><td>21</td><td class="points">${t[1]}</td></tr>`).join('')}</tbody></table>`,'Liga →')}</div><div class="finance">${panel('💰 FINANCE',`<div class="finance-body"><div class="money">${fmt(state.cash)} Kč</div><div class="finance-row"><span>Měsíční příjem</span><b class="green">+${fmt(state.monthlyIn)} Kč</b></div><div class="finance-row"><span>Měsíční výdaje</span><b style="color:var(--red)">−${fmt(state.monthlyOut)} Kč</b></div></div>`,'Detail →')}</div></div><div class="cards">${action('♟','TÝM','Soupiska, formace a vývoj hráčů','team')}${action('✦','TRÉNINK','Zlepšování hráčů a týmová chemie','training')}${action('⚔','TAKTIKA','Herní styl, tempo a forecheck','tactics')}${action('◍','STADION','Kapacita, atmosféra a reklama','stadium')}${action('⌕','SCOUTING','Talenty, skauti a watchlist','scout')}${action('⇄','PŘESTUPY','Nákupy, prodeje a kontrakty','transfers')}${action('▦','ZAŘÍZENÍ','Trénink, medicína a akademie','facilities')}${action('★','PERSONÁL','Trenéři a jejich specializace','staff')}${action('◈','ZÁPAS','Živá simulace a taktické zásahy','match')}</div></div>`}
function playerRow(p){return `<div class="player" onclick="selectPlayer(${p.id})"><div class="avatar">${p.n.split(' ').map(x=>x[0]).join('')}</div><div class="player-info"><b>${p.n}</b><small>${p.pos} • forma ${p.form}% • kondice ${p.fit}%</small></div><div class="mini-bar"><i style="width:${p.form}%"></i></div><div class="ovr">${p.ovr}</div></div>`}
function team(){const p=players.find(x=>x.id===state.selectedPlayer)||players[0];return title('Tým','Soupiska, formace, chemie a detail hráče')+`<div class="section-grid">${panel('SOUPISKA',`<div class="tabs"><button class="tab active">23 hráčů</button><button class="tab">Útočníci</button><button class="tab">Obránci</button><button class="tab">Brankáři</button></div><div class="player-list">${players.map(playerRow).join('')}</div>`,'Klikni na hráče')}${panel('DOPORUČENÁ SESTAVA',`<div class="notice">Automatické přiřazení zohledňuje OVR, kondici, formu, pozici a chemii.</div>${[['1. lajna','Novotný • Dvořák • Kovář','92%'],['2. lajna','Svoboda • Procházka • Němec','86%'],['1. obranný pár','Mareš • Král','91%'],['Brankář','Růžička','94%']].map(x=>`<div class="player"><div class="avatar">${x[0][0]}</div><div class="player-info"><b>${x[0]}</b><small>${x[1]}</small></div><b class="green">${x[2]}</b></div>`).join('')}<div style="padding:12px"><button class="action-btn" onclick="autoLineup()">⚡ Automatické přiřazení</button></div>`,'Upravit →')}${panel(p.n.toUpperCase(),`<div style="padding:14px"><div style="display:flex;justify-content:space-between;align-items:end"><div><div class="money" style="color:#55d9ff">${p.ovr} OVR</div><small style="color:var(--muted)">${p.pos} • potenciál ${p.pot}</small></div><b class="green">${p.form}% forma</b></div>${[['Střelba',p.shot],['Přihrávky',p.pass],['Rychlost',p.speed],['Bránění',p.def]].map(x=>`<div class="metric"><span>${x[0]}</span><b>${x[1]}</b></div><div class="progress"><i style="width:${x[1]}%"></i></div>`).join('')}<br><button class="action-btn" onclick="toast('Profil hráče otevřen')">OTEVŘÍT PROFIL</button></div>`,'Profil →')}</div>`}
function selectPlayer(id){state.selectedPlayer=id;render()}
function autoLineup(){state.lineupAuto=true;toast('Automatická sestava byla optimalizována');save()}
function training(){return title('Trénink','Denní rozvoj hráčů • plánování mění kondici a atributy')+`<div class="section-grid">${[['STŘELBA','+ zakončení','shot',4],['KONDICE','+ bruslení','speed',6],['OBRANA','+ poziční hra','def',4],['SÍLA','+ souboje','def',5],['TÝM','+ chemie','morale',2],['SPEC. TÝMY','+ PP / PK','pass',3]].map(x=>panel(x[0],`<div style="padding:14px"><div class="money" style="color:#55d9ff">${x[1]}</div><p style="color:var(--muted);font-size:9px">Náklady: −${x[3]} kondice. Efekt se projeví po dokončení tréninku.</p><button class="action-btn" onclick="runTraining('${x[2]}',${x[3]})">NAPLÁNOVAT</button></div>`)).join('')}</div>`}
function runTraining(attr,cost){players.forEach(p=>{p.fit=Math.max(40,p.fit-cost);if(attr==='morale')p.morale=Math.min(100,p.morale+1);else if(p[attr]!=null)p[attr]=Math.min(99,p[attr]+1)});state.trainingDone++;toast('Trénink dokončen • hráči se zlepšili');save();render()}
function tactics(){return title('Taktika','Nastavení ovlivňuje Match Power, šance, únavu a riziko')+`<div class="section-grid">${panel('HERNÍ STYL',`<div class="tabs">${[['defensive','DEFENZIVNÍ'],['balanced','VYVÁŽENÝ'],['attacking','ÚTOČNÝ']].map(x=>`<button class="tab ${state.tactic===x[0]?'active':''}" onclick="setTactic('${x[0]}')">${x[1]}</button>`).join('')}</div><div class="notice">${state.tactic==='attacking'?'Více střel a šancí, ale vyšší únava a riziko protiútoku.':state.tactic==='defensive'?'Více bloků a bezpečí, ale méně vytvořených šancí.':'Stabilní kompromis mezi útokem a obranou.'}</div>`,'Aktivní'),panel('FORECHECK',`<div class="tabs">${[['low','NÍZKÝ'],['medium','STŘEDNÍ'],['high','VYSOKÝ']].map(x=>`<button class="tab ${state.forecheck===x[0]?'active':''}" onclick="setTactic2('forecheck','${x[0]}')">${x[1]}</button>`).join('')}</div><div class="notice">Vysoký tlak zvyšuje šanci na zisk puku, ale rychleji unavuje lajny.</div>`),panel('TEMPO',`<div class="tabs">${[['slow','POMALÉ'],['normal','NORMÁLNÍ'],['fast','RYCHLÉ']].map(x=>`<button class="tab ${state.tempo===x[0]?'active':''}" onclick="setTactic2('tempo','${x[0]}')">${x[1]}</button>`).join('')}</div><div style="padding:12px"><button class="action-btn" onclick="save();toast('Taktika uložena')">ULOŽIT TAKTIKU</button></div>`)}</div>`}
function setTactic(t){state.tactic=t;save();render()}function setTactic2(k,v){state[k]=v;save();render()}
function league(){return title('Liga','1. liga • skupina 184 • základní část')+`<div class="section-grid">${panel('TABULKA',`<table class="league-table"><thead><tr><th>#</th><th>Tým</th><th>Z</th><th>Body</th><th>Forma</th></tr></thead><tbody>${leagueTeams.map((t,i)=>`<tr><td>${i+1}</td><td><b>${t[0]}</b></td><td>21</td><td class="points">${t[1]}</td><td>${i<2?'🔥':i>5?'⚠️':'•'}</td></tr>`).join('')}</tbody></table>`),panel('SEZÓNA',`<div style="padding:14px"><div class="money" style="color:#55d9ff">1. místo</div><p style="color:var(--muted);font-size:10px">Cíl vedení: vyhrát základní část a postoupit do finále play-off.</p><div class="metric"><span>Výhry</span><b>${state.seasonWins}</b></div><div class="metric"><span>Prohry</span><b>${state.seasonLoss}</b></div><div class="metric"><span>Forma klubu</span><b class="green">${state.reputation}%</b></div></div>`),panel('KALENDÁŘ',`<div class="notice">12. 10. • Northfire HC<br>16. 10. • Ice Wolves<br>20. 10. • Steel Bears<br>24. 10. • Ravens HC</div><div style="padding:12px"><button class="action-btn" onclick="toast('Kalendář sezóny otevřen')">CELÝ KALENDÁŘ</button></div>`)}</div>`}
function finance(){return title('Finance','Ekonomika klubu, sponzoři, mzdy a rozvoj')+`<div class="section-grid">${panel('KLUBOVÁ KASA',`<div style="padding:14px"><div class="money">${fmt(state.cash)} Kč</div><div class="metric"><span>Příjem / měsíc</span><b class="green">+${fmt(state.monthlyIn)} Kč</b></div><div class="metric"><span>Výdaje / měsíc</span><b style="color:var(--red)">−${fmt(state.monthlyOut)} Kč</b></div><div class="progress"><i style="width:${Math.min(100,state.cash/30000)}%"></i></div></div>`),panel('SPONZOŘI',`<div class="staff-card"><div class="staff-avatar">N</div><div><b>NorthPeak</b><small style="display:block;color:var(--muted)">+180 000 Kč / měsíc • hlavní partner</small></div></div><div class="staff-card"><div class="staff-avatar">F</div><div><b>Frostline</b><small style="display:block;color:var(--muted)">+95 000 Kč / měsíc • LED panely</small></div></div>`),panel('FANOUŠCI A PRESTIŽ',`<div style="padding:14px"><div class="metric"><span>Fanoušci</span><b>${state.fan}/100</b></div><div class="progress"><i style="width:${state.fan}%"></i></div><div class="metric"><span>Reputace</span><b>${state.reputation}/100</b></div><div class="progress"><i style="width:${state.reputation}%"></i></div></div>`)}</div>`}
function stadium(){return title('Stadion','Vargan Arena • fyzické úpravy ovlivňují příjmy, fanoušky a sponzory')+`<div class="section-grid"><div>${panel('VARGAN ARENA',`<div class="stadium-map"><div class="road h"></div><div class="road v"></div><div class="arena"></div><div class="building a"><b>VIP SEKTOR</b>Lv. ${state.vipLv}</div><div class="building b"><b>LED PANELY</b>Lv. ${state.ledLv}</div><div class="building c"><b>FAN ZÓNA</b>Lv. ${Math.min(10,state.stadiumLv)}</div><div class="building d"><b>OBCHOD</b>Lv. ${Math.max(1,state.stadiumLv-1)}</div></div>`)}${panel('PARAMETRY',`<div style="padding:13px"><div class="metric"><span>Kapacita</span><b>${fmt(state.capacity)}</b></div><div class="metric"><span>Atmosféra</span><b class="green">${state.atmosphere}%</b></div><div class="metric"><span>Stadion</span><b>Lv. ${state.stadiumLv}</b></div><button class="action-btn" onclick="upgrade('stadiumLv')">VYLEPŠIT STADION • 300k</button></div>`)}</div>${panel('VYLEPŠENÍ',`<div class="section-grid two" style="padding:0;gap:0">${[['LED PANELY','ledLv','150k','Více reklam a zápasových efektů.'],['VIP SEKTOR','vipLv','220k','Vyšší příjem z prémiových míst.'],['KAPACITA','stadiumLv','300k','Více míst a vyšší návštěvnost.']].map(x=>`<div class="staff-card"><div class="staff-avatar">◍</div><div style="flex:1"><b>${x[0]} • Lv. ${state[x[1]]}</b><small style="display:block;color:var(--muted)">${x[3]}</small></div><button class="action-btn" onclick="upgrade('${x[1]}')">${x[2]}</button></div>`).join('')}</div>`,'Rozvoj klubu')}</div>`}
function upgrade(key){const costs={stadiumLv:300000,ledLv:150000,vipLv:220000,trainingLv:250000,medicalLv:200000,academyLv:280000,scoutLv:180000};const c=costs[key]||150000;if(state[key]>=10){toast('Maximální úroveň');return}if(state.cash<c){toast('Nedostatek financí');return}state.cash-=c;state[key]++;if(key==='stadiumLv'){state.capacity+=750;state.atmosphere=Math.min(100,state.atmosphere+3);state.fan=Math.min(100,state.fan+2)}if(key==='ledLv')state.monthlyIn+=30000;if(key==='vipLv')state.monthlyIn+=40000;if(key==='academyLv')state.reputation=Math.min(100,state.reputation+2);save();toast('Upgrade dokončen');render()}
function facilities(){return title('Zařízení','Klubová základna • každá budova má vlastní efekt')+`<div class="section-grid">${[['TRÉNINKOVÉ CENTRUM','trainingLv','Vývoj hráčů +8 % / úroveň.','250000'],['MEDICAL CENTRUM','medicalLv','Regenerace +5 % / úroveň.','200000'],['AKADEMIE','academyLv','Lepší generace mladých talentů.','280000'],['SCOUTING CENTRUM','scoutLv','Rychlejší odhalování potenciálu.','180000']].map(x=>panel(x[0],`<div style="padding:14px"><div class="money" style="color:#55d9ff">Lv. ${state[x[1]]}</div><p style="color:var(--muted);font-size:9px">${x[2]}</p><button class="action-btn" onclick="upgrade('${x[1]}')">VYLEPŠIT • ${x[3]}</button></div>`)).join('')}</div>`}
function scout(){return title('Scouting','Skauti odhalují informace postupně • žádné okamžité odhalení potenciálu')+`<div class="section-grid">${panel('DOSTUPNÉ REPORTY',`<div class="player"><div class="avatar">FM</div><div class="player-info"><b>Filip Marek</b><small>C • 18 let • 76 OVR • potenciál 88–92</small></div><button class="action-btn" onclick="watch('Filip Marek')">${state.watchlist.includes('Filip Marek')?'SLEDOVÁN':'SLEDOVAT'}</button></div><div class="player"><div class="avatar">OK</div><div class="player-info"><b>Ondřej Koutný</b><small>G • 22 let • 79 OVR • potenciál 82–86</small></div><button class="action-btn" onclick="scoutReport()">SCOUT</button></div>`),panel('SKAUTING SÍŤ',`<div style="padding:14px"><div class="money" style="color:#55d9ff">Lv. ${state.scoutLv}</div><div class="metric"><span>Body skauta</span><b>${state.scoutPoints}</b></div><p style="color:var(--muted);font-size:9px">Česko • Slovensko • Finsko</p><button class="action-btn" onclick="upgrade('scoutLv')">ROZŠÍŘIT SÍŤ</button></div>`),panel('WATCHLIST',`<div style="padding:12px">${state.watchlist.length?state.watchlist.map(x=>`<div class="metric"><span>${x}</span><b class="green">SLEDOVÁN</b></div>`).join(''):'<div style="color:var(--muted);font-size:9px">Zatím žádní sledovaní hráči.</div>'}</div>`)}</div>`}
function watch(n){if(!state.watchlist.includes(n))state.watchlist.push(n);save();toast(n+' přidán na watchlist');render()}function scoutReport(){if(state.scoutPoints<1){toast('Nemáš scout body');return}state.scoutPoints--;save();toast('Scout report dokončen • potenciál upřesněn');render()}
function transfers(){return title('Přestupy','Živý trh • nabídky, vyjednávání a hráčský zájem')+`<div class="section-grid">${panel('TRH',`<div class="player"><div class="avatar">LB</div><div class="player-info"><b>Lukáš Beneš</b><small>LW • 87 OVR • cena 4,2 mil. Kč • smlouva 2 roky</small></div><button class="action-btn" onclick="negotiate('Lukáš Beneš',4200000)">VYJEDNÁVAT</button></div><div class="player"><div class="avatar">JK</div><div class="player-info"><b>Jan Kovář</b><small>RD • 84 OVR • cena 3,1 mil. Kč • smlouva 1 rok</small></div><button class="action-btn" onclick="negotiate('Jan Kovář',3100000)">VYJEDNÁVAT</button></div><div class="player"><div class="avatar">MZ</div><div class="player-info"><b>Marek Zima</b><small>C • 82 OVR • cena 2,6 mil. Kč • smlouva 3 roky</small></div><button class="action-btn" onclick="negotiate('Marek Zima',2600000)">VYJEDNÁVAT</button></div>`),panel('FREE AGENTS',`<div class="notice">Volní hráči jsou levnější, ale mohou požadovat vyšší podpisový bonus nebo delší smlouvu.</div><div style="padding:12px"><button class="action-btn" onclick="toast('Nový balík volných hráčů načten')">HLEDAT VOLNÉ HRÁČE</button></div>`),panel('MOJE PŘESTUPY',`<div style="padding:13px"><div class="metric"><span>Letos nakoupeno</span><b>2</b></div><div class="metric"><span>Letos prodáno</span><b>1</b></div><div class="metric"><span>Čisté saldo</span><b class="green">+620k</b></div></div>`)}</div>`}
function negotiate(n,c){const offer=Math.round(c*.88);if(state.cash<offer){toast('Na tuto nabídku nemáš dost peněz');return}state.cash-=offer;state.reputation=Math.min(100,state.reputation+1);save();toast(n+' • nabídka odeslána za '+fmt(offer)+' Kč');render()}
function staff(){return title('Personál','Každý člen má specializaci a ovlivňuje jinou část klubu')+`<div class="section-grid">${[['HLAVNÍ TRENÉR','Viktor Havel','Útočný systém • rozvoj talentů','Lv. 6'],['ASISTENT','Marek Šimek','Defenziva • PK • příprava','Lv. 5'],['TRENÉR BRANKÁŘŮ','Roman Vlk','Brankáři • reflexy • poziční hra','Lv. 5'],['KONDIČNÍ TRENÉR','Pavel Rys','Kondice • regenerace','Lv. 4'],['FYZIOTERAPEUT','Adam Kříž','Prevence zranění','Lv. 4'],['SKAUT','Daniel Vacek','Talent • odhad potenciálu','Lv. 5']].map(x=>panel(x[0],`<div class="staff-card"><div class="staff-avatar">${x[0][0]}</div><div><b>${x[1]}</b><small style="display:block;color:var(--muted)">${x[2]}</small><small style="display:block;color:#55d9ff;margin-top:3px">${x[3]}</small></div></div>`)).join('')}</div>`}
function match(){const min=Math.floor(state.sec/60),sec=String(state.sec%60).padStart(2,'0');const elapsed=state.sec;return title('Živý zápas','Serverová simulace • bez pauzy • 5 minut reálného času')+`<div class="dashboard"><section class="hero" style="height:325px"><div class="arena-lines"></div><div class="scoreboard">${state.period}. TŘETINA • ${min}:${sec}</div><div class="hero-content"><div class="versus"><div><div class="logo">${logo('vargan')}</div><div class="team">HC VARGAN</div><div class="scorebig">${state.home}</div></div><div><div class="vs">VS</div><span class="badge">${state.tactic==='attacking'?'ÚTOČNÁ':state.tactic==='defensive'?'DEFENZIVNÍ':'VYVÁŽENÁ'}</span></div><div><div class="logo away">${logo('northfire')}</div><div class="team">NORTHFIRE HC</div><div class="scorebig">${state.away}</div></div></div><div class="hero-stat"><div><b>${Math.min(99,55+Math.floor(elapsed/15))}%</b><small>tempo</small></div><div><b>${Math.min(100,68+Math.floor(elapsed/18))}%</b><small>momentum</small></div><div><b>${Math.max(70,94-Math.floor(elapsed/35))}%</b><small>kondice lajny</small></div></div><button class="start" onclick="startMatch()">${state.running?'ZÁPAS BĚŽÍ':'▶ SPUSTIT ZÁPAS'}</button></div></section><div>${panel('TAKTIKA',`<div class="tabs"><button class="tab ${state.tactic==='defensive'?'active':''}" onclick="setTactic('defensive')">🛡 Obrana</button><button class="tab ${state.tactic==='balanced'?'active':''}" onclick="setTactic('balanced')">⚖ Balanc</button><button class="tab ${state.tactic==='attacking'?'active':''}" onclick="setTactic('attacking')">🔥 Útok</button></div><div class="tabs"><button class="tab ${state.tempo==='slow'?'active':''}" onclick="setTactic2('tempo','slow')">Pomalé tempo</button><button class="tab ${state.tempo==='normal'?'active':''}" onclick="setTactic2('tempo','normal')">Normální</button><button class="tab ${state.tempo==='fast'?'active':''}" onclick="setTactic2('tempo','fast')">Rychlé</button></div>`)}${panel('UDÁLOSTI',`<div class="match-events">${state.events.length?state.events.slice().reverse().map(e=>`<div class="event">${e}<small>Match Engine 1.0</small></div>`).join(''):'<div class="event" style="color:var(--muted)">Čekáme na úvodní buly…</div>'}</div>`,'Live')}${panel('ZÁPASOVÉ PARAMETRY',`<div style="padding:10px 13px"><div class="metric"><span>Match Power Vargan</span><b>82.4</b></div><div class="metric"><span>Match Power soupeře</span><b>79.1</b></div><div class="metric"><span>Domácí výhoda</span><b class="green">+3%</b></div><div class="metric"><span>Momentum</span><b>${Math.min(100,68+Math.floor(elapsed/18))}%</b></div></div>`)} </div></div>`}
function startMatch(){if(state.running){toast('Zápas už běží');return}if(state.sec>=300){state.sec=0;state.home=0;state.away=0;state.period=1;state.events=[]}state.running=true;state.events.push('▶ Úvodní buly. Vargan nastupuje doma.');render();state.timer=setInterval(matchTick,1000)}
function matchTick(){if(!state.running)return;state.sec++;if(state.sec===35)state.events.push('🏒 0:35 • První velká šance Varganu. Brankář Northfire vyráží.');if(state.sec===82){state.home++;state.events.push('🥅 1:22 • GÓL! Novotný zakončuje po přihrávce Dvořáka.');}if(state.sec===112)state.events.push('⚠️ 1:52 • Vyloučení Northfire. Vargan má přesilovku.');if(state.sec===145)state.events.push('🧤 2:25 • Růžička drží Vargan ve hře skvělým zákrokem.');if(state.sec===181){state.away++;state.events.push('🥅 3:01 • GÓL! Northfire srovnává z rychlého protiútoku.');}if(state.sec===224)state.events.push('🔥 3:44 • Vargan přepíná na vyšší tempo.');if(state.sec===267){state.home++;state.events.push('🥅 4:27 • GÓL! Procházka vrací Varganu vedení.');}if(state.sec===75)state.period=2;if(state.sec===150)state.period=3;if(state.sec>=300){state.running=false;clearInterval(state.timer);state.timer=null;if(state.home>state.away){state.seasonWins++;state.cash+=90000;state.fan=Math.min(100,state.fan+2);state.events.push('🏁 Konec • Vargan vítězí! +90 000 Kč');}else if(state.home===state.away){state.seasonDraws++;state.cash+=55000;state.events.push('🏁 Konec • Remíza. +55 000 Kč');}else{state.seasonLoss++;state.cash+=25000;state.fan=Math.max(0,state.fan-1);state.events.push('🏁 Konec • Soupeř vítězí. +25 000 Kč');}save()}render()}
function resetSave(){if(confirm('Začít novou sezónu a resetovat postup?')){localStorage.removeItem('hockey11save');location.reload()}}
function render(){ $('side').innerHTML=navRender();$('cashTop').textContent=fmt(state.cash)+' Kč';const p=state.page;let html=p==='home'?home():p==='team'?team():p==='training'?training():p==='league'?league():p==='finance'?finance():p==='stadium'?stadium():p==='facilities'?facilities():p==='scout'?scout():p==='transfers'?transfers():p==='staff'?staff():p==='match'?match():p==='tactics'?tactics():home();$('main').innerHTML=html;save()}
render();
</script>
</body></html>
