<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Hockey Eleven — Prototype</title>
<style>
:root{--bg:#050a13;--panel:#0b1422;--panel2:#101d2e;--line:#1e3a58;--blue:#16a9ff;--blue2:#0875d1;--text:#eaf5ff;--muted:#8ea5bc;--green:#35d07f;--red:#ff4e63;--gold:#ffc83d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#12395b 0,#07111e 38%,#03070d 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button{font:inherit;color:inherit}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#050b14;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh}.logo{font-size:22px;font-weight:900;letter-spacing:-1px;margin:0 8px 5px}.tag{font-size:9px;color:#69bfff;letter-spacing:2px;margin:0 8px 20px}.club{background:linear-gradient(135deg,#102945,#081421);border:1px solid #214667;border-radius:14px;padding:13px;margin-bottom:16px}.club b{font-size:15px}.club small{display:block;color:var(--muted);margin-top:3px}.nav{display:grid;gap:7px}.nav button{background:transparent;border:1px solid transparent;padding:11px 12px;border-radius:9px;text-align:left;cursor:pointer;color:#b9c9d8}.nav button:hover,.nav button.active{background:#0d2740;border-color:#165b8a;color:white}.main{padding:18px;overflow:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.title h1{margin:0;font-size:26px}.title p{margin:4px 0;color:var(--muted);font-size:13px}.wallet{display:flex;gap:9px}.pill{background:#0b1b2d;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.card{background:linear-gradient(145deg,rgba(15,31,49,.96),rgba(6,15,25,.98));border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 10px 35px #0004}.hero{grid-column:span 8;min-height:220px;position:relative;overflow:hidden;background:linear-gradient(120deg,#0b2943,#07101b 62%),url('');}.hero:after{content:'🏒';position:absolute;right:45px;bottom:-35px;font-size:190px;opacity:.08;transform:rotate(-15deg)}.hero h2{font-size:38px;margin:8px 0}.hero .slogan{color:#72c9ff;font-weight:800}.stat{grid-column:span 4}.stat .big{font-size:32px;font-weight:900;margin:6px 0}.cards4{grid-column:span 12;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.mini{min-height:110px}.mini b{font-size:18px}.muted{color:var(--muted)}.btn{background:linear-gradient(135deg,#16a9ff,#0875d1);border:0;border-radius:9px;padding:10px 14px;font-weight:900;cursor:pointer;box-shadow:0 5px 18px #078df044}.btn.secondary{background:#0b1b2b;border:1px solid #245273}.btn.danger{background:#631a29}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.section-title{font-size:18px;font-weight:900;margin-bottom:10px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th{color:#7792aa;text-align:left;padding:8px;border-bottom:1px solid var(--line)}.table td{padding:9px 8px;border-bottom:1px solid #173047}.table tr.me{background:#0c3150}.form{display:flex;gap:3px}.dot{width:10px;height:10px;border-radius:2px;display:inline-block}.w{background:var(--green)}.d{background:var(--gold)}.l{background:var(--red)}.bar{height:7px;background:#10263a;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#0875d1,#27c4ff)}
/* team */.roster{grid-column:span 8}.lineup{grid-column:span 4}.player{display:grid;grid-template-columns:36px 1fr 45px 55px;gap:8px;align-items:center;padding:9px;border-bottom:1px solid #173047}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#24557a,#0b1725);font-weight:900}.ovr{font-weight:900}.tagpos{font-size:10px;color:#69bfff}.ice{height:310px;border-radius:14px;background:radial-gradient(ellipse at center,#dff7ff 0,#a9e8ff 36%,#4da9d3 37%,#bdefff 38%,#dff8ff 100%);position:relative;overflow:hidden;border:4px solid #c7f5ff;box-shadow:inset 0 0 50px #0875d155}.zone{position:absolute;top:0;bottom:0;width:2px;background:#e74c3c55;left:50%}.net{position:absolute;width:75px;height:34px;border:4px solid #e33b49;border-bottom:0;left:calc(50% - 37px);top:18px}.playerdot{position:absolute;width:42px;height:42px;border-radius:50%;background:#0c3555;color:white;display:grid;place-items:center;border:3px solid #fff;font-weight:900}.p1{left:50%;top:72px}.p2{left:22%;top:135px}.p3{right:22%;top:135px}.p4{left:37%;top:210px}.p5{right:37%;top:210px}.goalie{left:calc(50% - 21px);bottom:22px}.bench{margin-top:9px;color:var(--muted);font-size:11px}
/* match */.scoreboard{grid-column:span 12;text-align:center;padding:18px;background:linear-gradient(145deg,#0b2740,#060f19);border:1px solid #25557b;border-radius:15px}.score{font-size:58px;font-weight:1000;letter-spacing:4px}.teams{display:flex;justify-content:center;align-items:center;gap:30px;font-size:18px;font-weight:900}.period{color:#66c7ff;font-weight:800}.matchlog{grid-column:span 7;max-height:360px;overflow:auto}.controls{grid-column:span 5}.event{padding:9px;border-bottom:1px solid #173047;font-size:12px}.event strong{color:#fff}.event .time{color:#62c8ff;font-weight:900;margin-right:8px}.tactic{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin:10px 0}.tactic button{padding:9px;background:#0a1b2c;border:1px solid #244763;border-radius:8px;cursor:pointer}.tactic button.sel{border-color:#19b1ff;background:#0c3150}.meter{margin:12px 0}.meter .row{font-size:11px;color:var(--muted);margin-bottom:4px}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px}.logo,.tag,.club{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.main{padding:10px}.hero,.stat,.roster,.lineup,.matchlog,.controls{grid-column:span 12}.cards4{grid-template-columns:1fr 1fr}.score{font-size:42px}}
</style>
</head>
<body><div class="app"><aside class="side"><div class="logo">HOCKEY ELEVEN</div><div class="tag">BUILD • MANAGE • DOMINATE</div><div class="club"><b>🐺 HC VARGAN</b><small>1. liga • skupina A</small><small>Manažer: Jirka</small></div><div class="nav" id="nav"></div></aside><main class="main" id="main"></main></div>
<script src="hockey_eleven.js"></script></body></html>
