:root{
 --bg:#020813;--panel:#071727;--panel2:#0a2034;--line:#234c6b;

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#020711;color:var(--text)}

.app{

  radial-gradient(ellipse at 52% 2%,rgba(18,93,151,.22),transparent 36%),

function league(){return title('Liga','1. liga • skupina 184 • základní část')+`<div class="section-grid">${panel('TABULKA',`<table class="league-table"><thead><tr><th>#</th><th>Tým</th><th>Z</th><th>Body</th><th>Forma</th></tr></thead><tbody>${leagueTeams.map((t,i)=>`<tr><td>${i+1}</td><td><b>${t[0]}</b></td><td>21</td><td class="points">${t[1]}</td><td>${i<2?'🔥':i>5?'⚠️':'•'}</td></tr>`).join('')}</tbody></table>`),panel('SEZÓNA',`<div style="padding:14px"><div class="money" style="color:#55d9ff">1. místo</div><p style="color:var(--muted);font-size:10px">Cíl vedení: vyhrát základní část a postoupit do finále play-off.</p><div class="metric"><span>Výhry</span><b>${state.seasonWins}</b></div><div class="metric"><span>Prohry</span><b>${state.seasonLoss}</b></div><div class="metric"><span>Forma klubu</span><b class="green">${state.reputation}%</b></div></div>`),panel('KALENDÁŘ',`<div class="notice">12. 10. • Northfire HC<br>16. 10. • Ice Wolves<br>20. 10. • Steel Bears<br>24. 10. • Ravens HC</div><div style="padding:12px"><button class="action-btn" onclick="toast('Kalendář sezóny otevřen')">CELÝ KALENDÁŘ</button></div>`)}</div>`}
function finance(){return title('Finance','Ekonomika klubu, sponzoři, mzdy a rozvoj')+`<div class="section-grid">${panel('KLUBOVÁ KASA',`<div style="padding:14px"><div class="money">${fmt(state.cash)} Kč</div><div class="metric"><span>Příjem / měsíc</span><b class="green">+${fmt(state.monthlyIn)} Kč</b></div><div class="metric"><span>Výdaje / měsíc</span><b style="color:var(--red)">−${fmt(state.monthlyOut)} Kč</b></div><div class="progress"><i style="width:${Math.min(100,state.cash/30000)}%"></i></div></div>`),panel('SPONZOŘI',`<div class="staff-card"><div class="staff-avatar">N</div><div><b>NorthPeak</b><small style="display:block;color:var(--muted)">+180 000 Kč / měsíc • hlavní partner</small></div></div><div class="staff-card"><div class="staff-avatar">F</div><div><b>Frostline</b><small style="display:block;color:var(--muted)">+95 000 Kč / měsíc • LED panely</small></div></div>`),panel('FANOUŠCI A PRESTIŽ',`<div style="padding:14px"><div class="metric"><span>Fanoušci</span><b>${state.fan}/100</b></div><div class="progress"><i style="width:${state.fan}%"></i></div><div class="metric"><span>Reputace</span><b>${state.reputation}/100</b></div><div class="progress"><i style="width:${state.reputation}%"></i></div></div>`)}</div>`}
function stadium(){return title('Stadion','Vargan Arena • fyzické úpravy ovlivňují příjmy, fanoušky a sponzory')+`<div class="section-grid"><div>${panel('VARGAN ARENA',`<div class="stadium-map"><div class="road h"></div><div class="road v"></div><div class="arena"></div><div class="building a"><b>VIP SEKTOR</b>Lv. ${state.vipLv}</div><div class="building b"><b>LED PANELY</b>Lv. ${state.ledLv}</div><div class="building c"><b>FAN ZÓNA</b>Lv. ${Math.min(10,state.stadiumLv)}</div><div class="building d"><b>OBCHOD</b>Lv. ${Math.max(1,state.stadiumLv-1)}</div></div>`)}${panel('PARAMETRY',`<div style="padding:13px"><div class="metric"><span>Kapacita</span><b>${fmt(state.capacity)}</b></div><div class="metric"><span>Atmosféra</span><b class="green">${state.atmosphere}%</b></div><div class="metric"><span>Stadion</span><b>Lv. ${state.stadiumLv}</b></div><button class="action-btn" onclick="upgrade('stadiumLv')">VYLEPŠIT STADION • 300k</button></div>`)}</div>${panel('VYLEPŠENÍ',`<div class="section-grid two" style="padding:0;gap:0">${[['LED PANELY','ledLv','150k','Více reklam a zápasových efektů.'],['VIP SEKTOR','vipLv','220k','Vyšší příjem z prémiových míst.'],['KAPACITA','stadiumLv','300k','Více míst a vyšší návštěvnost.']].map(x=>`<div class="staff-card"><div class="staff-avatar">◍</div><div style="flex:1"><b>${x[0]} • Lv. ${state[x[1]]}</b><small style="display:block;color:var(--muted)">${x[3]}</small></div><button class="action-btn" onclick="upgrade('${x[1]}')">${x[2]}</button></div>`).join('')}</div>`,'Rozvoj klubu')}</div>`}
function upgrade(key){const costs={stadiumLv:300000,ledLv:150000,vipLv:220000,trainingLv:250000,medicalLv:200000,academyLv:280000,scoutLv:180000};const c=costs[key]||150000;if(state[key]>=10){toast('Maximální úroveň');return}if(state.cash<c){toast('Nedostatek financí');return}state.cash-=c;state[key]++;if(key==='stadiumLv'){state.capacity+=750;state.atmosphere=Math.min(100,state.atmosphere+3);state.fan=Math.min(100,state.fan+2)}if(key==='ledLv')state.monthlyIn+=30000;if(key==='vipLv')state.monthlyIn+=40000;if(key==='academyLv')state.reputation=Math.min(100,state.reputation+2);save();toast('Upgrade dokončen');render()}
function facilities(){return title('Zařízení','Klubová základna • každá budova má vlastní efekt')+`<div class="section-grid">${[['TRÉNINKOVÉ CENTRUM','trainingLv','Vývoj hráčů +8 % / úroveň.','250000'],['MEDICAL CENTRUM','medicalLv','Regenerace +5 % / úroveň.','200000'],['AKADEMIE','academyLv','Lepší generace mladých talentů.','280000'],['SCOUTING CENTRUM','scoutLv','Rychlejší odhalování potenciálu.','180000']].map(x=>panel(x[0],`<div style="padding:14px"><div class="money" style="color:#55d9ff">Lv. ${state[x[1]]}</div><p style="color:var(--muted);font-size:9px">${x[2]}</p><button class="action-btn" onclick="upgrade('${x[1]}')">VYLEPŠIT • ${x[3]}</button></div>`)).join('')}</div>`}
function scout(){return title('Scouting','Skauti odhalují informace postupně • žádné okamžité odhalení potenciálu')+`<div class="section-grid">${panel('DOSTUPNÉ REPORTY',`<div class="player"><div class="avatar">FM</div><div class="player-info"><b>Filip Marek</b><small>C • 18 let • 76 OVR • potenciál 88–92</small></div><button class="action-btn" onclick="watch('Filip Marek')">${state.watchlist.includes('Filip Marek')?'SLEDOVÁN':'SLEDOVAT'}</button></div><div class="player"><div class="avatar">OK</div><div class="player-info"><b>Ondřej Koutný</b><small>G • 22 let • 79 OVR • potenciál 82–86</small></div><button class="action-btn" onclick="scoutReport()">SCOUT</button></div>`),panel('SKAUTING SÍŤ',`<div style="padding:14px"><div class="money" style="color:#55d9ff">Lv. ${state.scoutLv}</div><div class="metric"><span>Body skauta</span><b>${state.scoutPoints}</b></div><p style="color:var(--muted);font-size:9px">Česko • Slovensko • Finsko</p><button class="action-btn" onclick="upgrade('scoutLv')">ROZŠÍŘIT SÍŤ</button></div>`),panel('WATCHLIST',`<div style="padding:12px">${state.watchlist.length?state.watchlist.map(x=>`<div class="metric"><span>${x}</span><b class="green">SLEDOVÁN</b></div>`).join(''):'<div style="color:var(--muted);font-size:9px">Zatím žádní sledovaní hráči.</div>'}</div>`)}</div>`}
function watch(n){if(!state.watchlist.includes(n))state.watchlist.push(n);save();toast(n+' přidán na watchlist');render()}function scoutReport(){if(state.scoutPoints<1){toast('Nemáš scout body');return}state.scoutPoints--;save();toast('Scout report dokončen • potenciál upřesněn');render()}
function transfers(){return title('Přestupy','Živý trh • nabídky, vyjednávání a hráčský zájem')+`<div class="section-grid">${panel('TRH',`<div class="player"><div class="avatar">LB</div><div class="player-info"><b>Lukáš Beneš</b><small>LW • 87 OVR • cena 4,2 mil. Kč • smlouva 2 roky</small></div><button class="action-btn" onclick="negotiate('Lukáš Beneš',4200000)">VYJEDNÁVAT</button></div><div class="player"><div class="avatar">JK</div><div class="player-info"><b>Jan Kovář</b><small>RD • 84 OVR • cena 3,1 mil. Kč • smlouva 1 rok</small></div><button class="action-btn" onclick="negotiate('Jan Kovář',3100000)">VYJEDNÁVAT</button></div><div class="player"><div class="avatar">MZ</div><div class="player-info"><b>Marek Zima</b><small>C • 82 OVR • cena 2,6 mil. Kč • smlouva 3 roky</small></div><button class="action-btn" onclick="negotiate('Marek Zima',2600000)">VYJEDNÁVAT</button></div>`),panel('FREE AGENTS',`<div class="notice">Volní hráči jsou levnější, ale mohou požadovat vyšší podpisový bonus nebo delší smlouvu.</div><div style="padding:12px"><button class="action-btn" onclick="toast('Nový balík volných hráčů načten')">HLEDAT VOLNÉ HRÁČE</button></div>`),panel('MOJE PŘESTUPY',`<div style="padding:13px"><div class="metric"><span>Letos nakoupeno</span><b>2</b></div><div class="metric"><span>Letos prodáno</span><b>1</b></div><div class="metric"><span>Čisté saldo</span><b class="green">+620k</b></div></div>`)}</div>`}
function negotiate(n,c){const offer=Math.round(c*.88);if(state.cash<offer){toast('Na tuto nabídku nemáš dost peněz');return}state.cash-=offer;state.reputation=Math.min(100,state.reputation+1);save();toast(n+' • nabídka odeslána za '+fmt(offer)+' Kč');render()}
function staff(){return title('Personál','Každý člen má specializaci a ovlivňuje jinou část klubu')+`<div class="section-grid">${[['HLAVNÍ TRENÉR','Viktor Havel','Útočný systém • rozvoj talentů','Lv. 6'],['ASISTENT','Marek Šimek','Defenziva • PK • příprava','Lv. 5'],['TRENÉR BRANKÁŘŮ','Roman Vlk','Brankáři • reflexy • poziční hra','Lv. 5'],['KONDIČNÍ TRENÉR','Pavel Rys','Kondice • regenerace','Lv. 4'],['FYZIOTERAPEUT','Adam Kříž','Prevence zranění','Lv. 4'],['SKAUT','Daniel Vacek','Talent • odhad potenciálu','Lv. 5']].map(x=>panel(x[0],`<div class="staff-card"><div class="staff-avatar">${x[0][0]}</div><div><b>${x[1]}</b><small style="display:block;color:var(--muted)">${x[2]}</small><small style="display:block;color:#55d9ff;margin-top:3px">${x[3]}</small></div></div>`)).join('')}</div>`}
function match(){const min=Math.floor(state.sec/60),sec=String(state.sec%60).padStart(2,'0');const elapsed=state.sec;return title('Živý zápas','Serverová simulace • bez pauzy • 5 minut reálného času')+`<div class="dashboard"><section class="hero" style="height:325px"><div class="arena-lines"></div><div class="scoreboard">${state.period}. TŘETINA • ${min}:${sec}</div><div class="hero-content"><div class="versus"><div><div class="logo">${logo('vargan')}</div><div class="team">HC VARGAN</div><div class="scorebig">${state.home}</div></div><div><div class="vs">VS</div><span class="badge">${state.tactic==='attacking'?'ÚTOČNÁ':state.tactic==='defensive'?'DEFENZIVNÍ':'VYVÁŽENÁ'}</span></div><div><div class="logo away">${logo('northfire')}</div><div class="team">NORTHFIRE HC</div><div class="scorebig">${state.away}</div></div></div><div class="hero-stat"><div><b>${Math.min(99,55+Math.floor(elapsed/15))}%</b><small>tempo</small></div><div><b>${Math.min(100,68+Math.floor(elapsed/18))}%</b><small>momentum</small></div><div><b>${Math.max(70,94-Math.floor(elapsed/35))}%</b><small>kondice lajny</small></div></div><button class="start" onclick="startMatch()">${state.running?'ZÁPAS BĚŽÍ':'▶ SPUSTIT ZÁPAS'}</button></div></section><div>${panel('TAKTIKA',`<div class="tabs"><button class="tab ${state.tactic==='defensive'?'active':''}" onclick="setTactic('defensive')">🛡 Obrana</button><button class="tab ${state.tactic==='balanced'?'active':''}" onclick="setTactic('balanced')">⚖ Balanc</button><button class="tab ${state.tactic==='attacking'?'active':''}" onclick="setTactic('attacking')">🔥 Útok</button></div><div class="tabs"><button class="tab ${state.tempo==='slow'?'active':''}" onclick="setTactic2('tempo','slow')">Pomalé tempo</button><button class="tab ${state.tempo==='normal'?'active':''}" onclick="setTactic2('tempo','normal')">Normální</button><button class="tab ${state.tempo==='fast'?'active':''}" onclick="setTactic2('tempo','fast')">Rychlé</button></div>`)}${panel('UDÁLOSTI',`<div class="match-events">${state.events.length?state.events.slice().reverse().map(e=>`<div class="event">${e}<small>Match Engine 1.0</small></div>`).join(''):'<div class="event" style="color:var(--muted)">Čekáme na úvodní buly…</div>'}</div>`,'Live')}${panel('ZÁPASOVÉ PARAMETRY',`<div style="padding:10px 13px"><div class="metric"><span>Match Power Vargan</span><b>82.4</b></div><div class="metric"><span>Match Power soupeře</span><b>79.1</b></div><div class="metric"><span>Domácí výhoda</span><b class="green">+3%</b></div><div class="metric"><span>Momentum</span><b>${Math.min(100,68+Math.floor(elapsed/18))}%</b></div></div>`)} </div></div>`}
function startMatch(){if(state.running){toast('Zápas už běží');return}if(state.sec>=300){state.sec=0;state.home=0;state.away=0;state.period=1;state.events=[]}state.running=true;state.events.push('▶ Úvodní buly. Vargan nastupuje doma.');render();state.timer=setInterval(matchTick,1000)}
function matchTick(){if(!state.running)return;state.sec++;if(state.sec===35)state.events.push('🏒 0:35 • První velká šance Varganu. Brankář Northfire vyráží.');if(state.sec===82){state.home++;state.events.push('🥅 1:22 • GÓL! Novotný zakončuje po přihrávce Dvořáka.');}if(state.sec===112)state.events.push('⚠️ 1:52 • Vyloučení Northfire. Vargan má přesilovku.');if(state.sec===145)state.events.push('🧤 2:25 • Růžička drží Vargan ve hře skvělým zákrokem.');if(state.sec===181){state.away++;state.events.push('🥅 3:01 • GÓL! Northfire srovnává z rychlého protiútoku.');}if(state.sec===224)state.events.push('🔥 3:44 • Vargan přepíná na vyšší tempo.');if(state.sec===267){state.home++;state.events.push('🥅 4:27 • GÓL! Procházka vrací Varganu vedení.');}if(state.sec===75)state.period=2;if(state.sec===150)state.period=3;if(state.sec>=300){state.running=false;clearInterval(state.timer);state.timer=null;if(state.home>state.away){state.seasonWins++;state.cash+=90000;state.fan=Math.min(100,state.fan+2);state.events.push('🏁 Konec • Vargan vítězí! +90 000 Kč');}else if(state.home===state.away){state.seasonDraws++;state.cash+=55000;state.events.push('🏁 Konec • Remíza. +55 000 Kč');}else{state.seasonLoss++;state.cash+=25000;state.fan=Math.max(0,state.fan-1);state.events.push('🏁 Konec • Soupeř vítězí. +25 000 Kč');}save()}render()}
function resetSave(){if(confirm('Začít novou sezónu a resetovat postup?')){localStorage.removeItem('hockey11save');location.reload()}}
function render(){ $('side').innerHTML=navRender();$('cashTop').textContent=fmt(state.cash)+' Kč';const p=state.page;let html=p==='home'?home():p==='team'?team():p==='training'?training():p==='league'?league():p==='finance'?finance():p==='stadium'?stadium():p==='facilities'?facilities():p==='scout'?scout():p==='transfers'?transfers():p==='staff'?staff():p==='match'?match():p==='tactics'?tactics():home();$('main').innerHTML=html;save()}
render();
</script>
</body></html>
