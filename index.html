<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b14">
<title>Hockey Eleven</title>
<style>
:root{--bg:#030812;--top:#06101c;--panel:#091827;--panel2:#0b1e31;--line:#173954;--line2:#225477;--blue:#0b82ff;--blue2:#31b2ff;--cyan:#64d7ff;--text:#f4f8fc;--muted:#7891a7;--green:#42e88e;--red:#ff6269;--gold:#ffc936}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;color:inherit}button{cursor:pointer}.app{height:100vh;width:100vw;min-width:980px;display:grid;grid-template-columns:210px 1fr;grid-template-rows:72px 1fr;background:radial-gradient(ellipse at 58% 0,#123452 0,#061422 34%,#020711 72%);position:relative}.app:after{content:"";position:absolute;inset:72px 0 0 210px;background:linear-gradient(180deg,#07172722,#020711c9 80%),radial-gradient(ellipse at 50% 15%,#1d6aa522,transparent 58%);pointer-events:none}
.top{grid-column:1/3;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:8px 18px;border-bottom:1px solid #17344d;background:#040c16e8;backdrop-filter:blur(20px)}.brand{display:flex;align-items:center;min-width:430px}.brand-mark{width:44px;height:50px;display:grid;place-items:center;position:relative;margin-right:12px;filter:drop-shadow(0 5px 13px #0787ff55)}.brand-mark:before{content:"";position:absolute;inset:0;background:linear-gradient(150deg,#f7fbff,#0b83ff);clip-path:polygon(50% 0,92% 13%,92% 69%,50% 100%,8% 69%,8% 13%)}.brand-mark span{position:relative;font-size:21px;color:#071426}.brand-title{font-size:20px;font-weight:950;letter-spacing:.06em;line-height:1}.brand-title span{color:#1596ff}.club{margin-left:24px;padding-left:22px;border-left:1px solid #1a344b}.club strong{display:block;font-size:14px}.club small{color:var(--muted);font-size:11px}.top-right{display:flex;align-items:center;gap:8px}.top-pill{min-width:145px;height:46px;padding:6px 12px;border:1px solid #183a56;border-radius:12px;background:linear-gradient(180deg,#0a1c2d,#071523);box-shadow:inset 0 1px #ffffff08}.top-pill small{display:block;color:#7893a9;font-size:9px;text-transform:uppercase;letter-spacing:.08em}.top-pill strong{display:block;margin-top:3px;font-size:13px}.green{color:var(--green)}.gear{width:44px;height:44px;border:1px solid #1a3b56;background:#071625;border-radius:12px;font-size:19px}
.side{z-index:10;padding:14px 10px;border-right:1px solid #17344d;background:linear-gradient(180deg,#06111d,#030911);display:flex;flex-direction:column;gap:4px}.navbtn{height:42px;border:1px solid transparent;border-radius:10px;background:transparent;color:#8ea5b8;display:flex;align-items:center;gap:12px;padding:0 13px;text-align:left;font-weight:700;font-size:13px;transition:.16s}.navbtn:hover{background:#0b2033;color:#fff}.navbtn.active{color:#fff;background:linear-gradient(90deg,#087fff,#0758b7);border-color:#3baeff55;box-shadow:0 7px 24px #087cff33}.navicon{width:22px;display:grid;place-items:center;color:#dceaf4}.side-bottom{margin-top:auto;padding-top:10px;border-top:1px solid #17344d}
.main{z-index:2;overflow:auto;padding:18px 20px 24px;scrollbar-width:none}.main::-webkit-scrollbar{display:none}.dashboard{max-width:1500px;margin:auto;display:grid;grid-template-columns:minmax(560px,1.55fr) minmax(320px,.72fr);gap:14px}.hero{height:366px;position:relative;overflow:hidden;border:1px solid #1d5883;border-radius:18px;background:linear-gradient(180deg,#0a2742,#05101b);box-shadow:0 20px 55px #0009}.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 13% 13%,#ffffffcc 0 1.2%,transparent 2.8%),radial-gradient(circle at 87% 13%,#ffffffcc 0 1.2%,transparent 2.8%),linear-gradient(180deg,transparent 0 35%,#03101de8 100%)}.hero:after{content:"";position:absolute;left:5%;right:5%;bottom:-24%;height:62%;border-radius:50%;background:radial-gradient(ellipse at center,#e6f8ff 0 35%,#8fb8cd 70%,#3b6075 72%);box-shadow:0 -18px 70px #59c7ff2e}.arena-lines{position:absolute;inset:0;opacity:.7;background:repeating-linear-gradient(110deg,transparent 0 75px,#7ecfff09 76px 78px)}.scoreboard{position:absolute;top:28px;left:50%;transform:translateX(-50%);width:170px;height:52px;border:1px solid #5caeff33;border-radius:8px;background:#05101bd9;box-shadow:0 8px 25px #0008;display:flex;align-items:center;justify-content:center;gap:8px;font-size:10px;letter-spacing:.12em;color:#a9c7dc}.hero-content{position:absolute;inset:0;z-index:2;padding:21px 24px;display:flex;flex-direction:column}.eyebrow{font-size:10px;color:#a9c9df;letter-spacing:.12em;font-weight:850}.hero h1{font-size:17px;margin:3px 0 0}.versus{margin:auto;display:grid;grid-template-columns:1fr 110px 1fr;align-items:center;width:90%;text-align:center}.team{font-size:20px;font-weight:950;letter-spacing:.01em}.record{font-size:11px;color:#9bb2c5;margin-top:3px}.logo{width:72px;height:72px;margin:0 auto 8px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(145deg,#edf8ff,#197fce);border:1px solid #9edcff88;box-shadow:0 9px 30px #0009}.logo svg{width:53px;height:53px}.logo.away{background:linear-gradient(145deg,#ffef78,#ff5c24);border-color:#ffd15c88}.vs{font-size:26px;font-weight:1000}.date{font-size:12px;color:#c4d6e3;line-height:1.5;margin-top:3px}.start{align-self:center;border:1px solid #56bdff55;border-radius:12px;padding:12px 34px;background:linear-gradient(90deg,#087cff,#0da7ff);box-shadow:0 10px 30px #087cff44;font-weight:900;font-size:13px}.start:hover{filter:brightness(1.1)}
.panel{border:1px solid var(--line);border-radius:15px;background:linear-gradient(180deg,#0a1c2ceF,#06111deF);box-shadow:0 12px 35px #0007;overflow:hidden}.panel-head{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #16364f}.panel-head h2{font-size:13px;margin:0;font-weight:900;letter-spacing:.03em}.link{font-size:11px;color:#42adff}.standings{height:244px}.standings table{width:100%;border-collapse:collapse;font-size:11px}.standings th,.standings td{padding:8px 10px;border-bottom:1px solid #102a40;text-align:left}.standings th{font-size:9px;color:#708ba0;text-transform:uppercase;letter-spacing:.08em}.standings tr:first-child{background:#087cff18}.rank{color:#a4b9c9;width:25px}.points{font-weight:900;color:var(--green)}.finance{margin-top:12px;padding:0}.finance .panel{height:110px}.finance .panel-head{height:39px}.finance-body{padding:9px 16px}.money{font-size:21px;font-weight:950;color:var(--green)}.finance-row{display:flex;justify-content:space-between;align-items:center;padding-top:5px;color:#8ca5b8;font-size:11px}.finance-row b{color:#eaf3f8}.cards{grid-column:1/3;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:0}.action{height:104px;position:relative;padding:16px 18px;cursor:pointer;transition:.16s}.action:hover{transform:translateY(-2px);border-color:#2b8dcc;box-shadow:0 15px 38px #0008}.action:before{content:"";position:absolute;right:-25px;bottom:-50px;width:180px;height:150px;background:radial-gradient(circle,#168cff30,transparent 67%);pointer-events:none}.action h3{margin:0 0 5px;font-size:14px}.action p{margin:0;max-width:240px;color:#7f98ac;font-size:10px;line-height:1.45}.action-icon{position:absolute;right:17px;top:23px;color:#c9e7f7}.action-icon svg{width:35px;height:35px;stroke:currentColor;fill:none;stroke-width:1.7}
.page-title{max-width:1500px;margin:0 auto 14px}.page-title h1{margin:0;font-size:24px}.page-title p{margin:4px 0;color:var(--muted);font-size:11px}.section-grid{max-width:1500px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.player-list{max-height:550px;overflow:auto}.player{display:flex;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid #122c42}.avatar{width:39px;height:39px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#193a55,#091725);border:1px solid #1c4867;font-size:11px;font-weight:900}.player-info{flex:1}.player-info b{font-size:12px}.player-info small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.ovr{font-size:18px;font-weight:950;color:#55d9ff}.mini-bar{width:50px;height:4px;background:#10283a;border-radius:99px;overflow:hidden}.mini-bar i{display:block;height:100%;background:var(--green);border-radius:99px}.tabs{display:flex;gap:6px;padding:12px 14px;flex-wrap:wrap}.tab{border:1px solid #1b3e5a;background:#081a2a;border-radius:8px;padding:7px 10px;font-size:10px;color:#8ea8bb}.tab.active{background:#087cff;color:#fff;border-color:#38aaff}.action-btn{border:1px solid #2b9cff55;border-radius:8px;padding:8px 11px;background:#087cff;font-weight:850;font-size:10px}.ghost{background:#122b40}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);padding:10px 15px;border-radius:10px;border:1px solid #2a9eff;background:#09253b;box-shadow:0 10px 35px #000b;z-index:99;font-weight:750;font-size:11px}.scorebig{font-size:28px;font-weight:1000;margin-top:2px}.badge{display:inline-block;margin-top:7px;padding:5px 8px;border:1px solid #2d8ac3;border-radius:7px;color:#8fd5ff;font-size:9px}
@media(max-width:1180px){.app{grid-template-columns:76px 1fr}.app:after{left:76px}.brand-title,.club,.top-pill{display:none}.brand{min-width:0}.side{padding:12px 8px}.navbtn{justify-content:center;padding:0}.navbtn span:last-child{display:none}.navicon{width:auto}.dashboard{grid-template-columns:minmax(500px,1.5fr) minmax(290px,.8fr)}.cards{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="brand-mark"><span>🏒</span></div><div class="brand-title">HOCKEY <span>ELEVEN</span></div><div class="club"><strong>HC VARGAN</strong><small>1. liga • 12–6–3 • 32 bodů</small></div></div><div class="top-right"><div class="top-pill"><small>Klubová kasa</small><strong>2 450 000 Kč <span class="green">+480k</span></strong></div><div class="top-pill"><small>1. liga</small><strong>🏆 1. místo</strong></div><div class="top-pill"><small>Další zápas</small><strong>12. 10. • 18:00</strong></div><button class="gear" onclick="toast('Nastavení bude brzy dostupné')">⚙</button></div></header>
<aside class="side" id="side"></aside><main class="main" id="main"></main>
</div>
<script>
'use strict';
const nav=[['home','⌂','Domů'],['team','♟','Tým'],['match','◈','Zápasy'],['league','♜','Liga'],['finance','◉','Finance'],['stadium','◍','Stadion'],['training','✦','Trénink'],['tactics','⚔','Taktika'],['scout','⌕','Scouting'],['transfers','⇄','Přestupy'],['facilities','▦','Zařízení']];
const state={page:'home',running:false,sec:0,home:0,away:0,period:1,tactic:'balanced',events:[],timer:null};
const players=[['Jakub Novotný','C',85,91],['David Dvořák','LW',83,86],['Martin Kovář','RW',81,78],['Petr Svoboda','C',78,82],['Lukáš Procházka','LW',78,88],['Ondřej Němec','RW',76,75],['Filip Mareš','D',80,91],['Jan Král','D',78,84],['Adam Hájek','D',76,81],['Dominik Růžička','G',82,94]];
const teams=[['HC Vargan',32],['Northfire HC',28],['Ice Wolves',25],['Steel Bears',23],['Ravens HC',21]];
function $(id){return document.getElementById(id)}
function go(p){state.page=p;render()}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1700)}
function navRender(){return nav.map(n=>`<button class="navbtn ${state.page===n[0]?'active':''}" onclick="go('${n[0]}')"><span class="navicon">${n[1]}</span><span>${n[2]}</span></button>`).join('')+`<div class="side-bottom"><button class="navbtn" onclick="toast('Nastavení bude brzy dostupné')"><span class="navicon">⚙</span><span>Nastavení</span></button></div>`}
function panel(t,b,l=''){return `<section class="panel"><div class="panel-head"><h2>${t}</h2>${l?`<span class="link">${l}</span>`:''}</div>${b}</section>`}
function logo(type){if(type==='vargan')return `<svg viewBox="0 0 80 80"><path d="M40 6 68 16v25c0 18-11 28-28 34C23 69 12 59 12 41V16z" fill="#0b5da9" stroke="#eaf7ff" stroke-width="3"/><path d="M25 42 33 24l7 10 8-10 8 18-10-5-6 12-6-12z" fill="#fff"/></svg>`;return `<svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="29" fill="#f9b52b" stroke="#fff" stroke-width="3"/><path d="M17 40h46M25 25c10 8 20 22 30 30M55 25c-10 8-20 22-30 30" stroke="#ff5a28" stroke-width="6"/><path d="M21 54c12-6 26-6 38 0" stroke="#111b2a" stroke-width="7"/></svg>`}
function home(){return `<div class="dashboard"><section class="hero"><div class="arena-lines"></div><div class="scoreboard">VARGAN ARENA • 18:00</div><div class="hero-content"><div class="eyebrow">DALŠÍ ZÁPAS • 1. LIGA • 12. KOLO</div><h1>Domácí zápas</h1><div class="versus"><div><div class="logo">${logo('vargan')}</div><div class="team">HC VARGAN</div><div class="record">12–6–3</div></div><div><div class="vs">VS</div><div class="date">12. 10. 2026<br>18:00</div></div><div><div class="logo away">${logo('northfire')}</div><div class="team">NORTHFIRE HC</div><div class="record">10–8–3</div></div></div><button class="start" onclick="go('match')">▶ &nbsp; ZAHÁJIT ZÁPAS</button></div></section><div><div class="standings">${panel('🏆  TABULKA LIGY',`<table><thead><tr><th>#</th><th>Tým</th><th>Z</th><th>V</th><th>B</th></tr></thead><tbody>${teams.map((t,i)=>`<tr><td class="rank">${i+1}</td><td><b>${t[0]}</b></td><td>21</td><td>${15-i}</td><td class="points">${t[1]}</td></tr>`).join('')}</tbody></table>`,'Celá liga →')}</div><div class="finance">${panel('💰  FINANCE',`<div class="finance-body"><div class="money">2 450 000 Kč</div><div class="finance-row"><span>Příjmy / měsíc</span><b class="green">+480 000 Kč</b></div><div class="finance-row"><span>Výdaje / měsíc</span><b style="color:var(--red)">−320 000 Kč</b></div></div>`,'Detail →')}</div></div><div class="cards">${action('♟','TÝM','Soupiska, formace a vývoj hráčů','team')}${action('✦','TRÉNINK','Zlepšování hráčů a tréninkové plány','training')}${action('⚔','TAKTIKA','Formace a strategie zápasu','tactics')}${action('◍','STADION','Vylepšení a zázemí','stadium')}${action('⌕','SCOUTING','Hledání talentů a sledování hráčů','scout')}${action('⇄','PŘESTUPY','Nákupy a prodeje hráčů','transfers')}</div></div>`}
function action(icon,title,text,page){return `<section class="panel action" onclick="go('${page}')"><div class="action-icon"><svg viewBox="0 0 40 40"><text x="20" y="29" text-anchor="middle" font-size="26" fill="currentColor">${icon}</text></svg></div><h3>${title}</h3><p>${text}</p></section>`}
function title(t,s){return `<div class="page-title"><h1>${t}</h1><p>${s}</p></div>`}
function team(){return title('Tým','Soupiska, formace a automatické přiřazení')+`<div class="section-grid">${panel('SOUPISKA',`<div class="tabs"><button class="tab active">Všichni 23</button><button class="tab">Útočníci</button><button class="tab">Obránci</button><button class="tab">Brankáři</button></div><div class="player-list">${players.map(p=>`<div class="player"><div class="avatar">${p[0].split(' ').map(x=>x[0]).join('')}</div><div class="player-info"><b>${p[0]}</b><small>${p[1]} • ${p[3]}% forma</small></div><div class="mini-bar"><i style="width:${p[3]}%"></i></div><div class="ovr">${p[2]}</div></div>`).join('')}</div>`,'Formace →')}${panel('DOPORUČENÁ SESTAVA',`<div class="player"><div class="avatar">01</div><div class="player-info"><b>1. lajna</b><small>Novotný • Dvořák • Kovář</small></div><b class="green">92%</b></div><div class="player"><div class="avatar">02</div><div class="player-info"><b>2. lajna</b><small>Svoboda • Procházka • Němec</small></div><b class="green">86%</b></div><div style="padding:14px"><button class="action-btn" onclick="toast('Automatické přiřazení dokončeno')">⚡ Automatické přiřazení</button></div>`,'Upravit →')}${panel('JAKUB NOVOTNÝ',`<div style="padding:17px"><div class="money" style="color:#55d9ff">85 OVR</div><div class="finance-row"><span>Střelba</span><b>88</b></div><div class="finance-row"><span>Přihrávky</span><b>84</b></div><div class="finance-row"><span>Rychlost</span><b>86</b></div><div class="finance-row"><span>Bránění</span><b>80</b></div><br><button class="action-btn" onclick="toast('Detail hráče')">Otevřít profil</button></div>`,'Profil →')}</div>`}
function simple(titleText,sub,items){return title(titleText,sub)+`<div class="section-grid">${items.map(x=>panel(x[0],`<div style="padding:17px"><div class="money" style="color:${x[2]||'#55d9ff'}">${x[1]}</div><p style="color:var(--muted);font-size:11px">${x[3]}</p><button class="action-btn" onclick="toast('${x[4]||'Hotovo'}')">${x[5]||'OTEVŘÍT'}</button></div>`)).join('')}</div>`}
function training(){return simple('Trénink','Denní rozvoj hráčů, kondice a týmová chemie',[['STŘELBA','+ zakončení','','−4 kondice • vyšší efektivita střelby.','Trénink naplánován','NAPLÁNOVAT'],['KONDICE','+ bruslení','','−6 kondice • lepší tempo.','Trénink naplánován','NAPLÁNOVAT'],['OBRANA','+ poziční hra','','−4 kondice • lepší blokování.','Trénink naplánován','NAPLÁNOVAT'],['SÍLA','+ souboje','','−5 kondice • lepší hra u mantinelu.','Trénink naplánován','NAPLÁNOVAT'],['TÝM','+ chemie','','−2 kondice • lepší souhra lajny.','Trénink naplánován','NAPLÁNOVAT'],['SPEC. TÝMY','+ PP / PK','','−3 kondice • přesilovky a oslabení.','Trénink naplánován','NAPLÁNOVAT']])}
function league(){return title('Liga','1. liga • Skupina 184 • 14 klubů')+`<div class="section-grid">${panel('TABULKA',`<table><tbody>${teams.map((t,i)=>`<tr><td>${i+1}</td><td><b>${t[0]}</b></td><td>21</td><td class="points">${t[1]}</td></tr>`).join('')}</tbody></table>`)}${panel('SEZÓNA',`<div style="padding:17px"><div class="money" style="color:#55d9ff">1. místo</div><p style="color:var(--muted);font-size:11px">Cíl vedení: vyhrát základní část a postoupit do finále play-off.</p><button class="action-btn" onclick="toast('Kalendář otevřen')">KALENDÁŘ</button></div>`)}${panel('POŘADÍ SKUPINY',`<div style="padding:17px"><div class="finance-row"><span>Play-off</span><b class="green">ANO</b></div><div class="finance-row"><span>Evropský pohár</span><b>3. místo+</b></div><div class="finance-row"><span>Sestup</span><b style="color:var(--red)">13.–14.</b></div></div>`)}</div>`}
function match(){const m=Math.floor(state.sec/60),s=String(state.sec%60).padStart(2,'0');return title('Živý zápas','Serverová simulace • zápas pokračuje i po zavření aplikace')+`<div class="dashboard"><section class="hero" style="height:330px"><div class="arena-lines"></div><div class="scoreboard">${state.period}. TŘETINA • ${m}:${s}</div><div class="hero-content"><div class="versus"><div><div class="logo">${logo('vargan')}</div><div class="team">HC VARGAN</div><div class="scorebig">${state.home}</div></div><div><div class="vs">VS</div><span class="badge">${state.tactic==='attacking'?'ÚTOČNÁ':state.tactic==='defensive'?'DEFENZIVNÍ':'VYVÁŽENÁ'}</span></div><div><div class="logo away">${logo('northfire')}</div><div class="team">NORTHFIRE HC</div><div class="scorebig">${state.away}</div></div></div><button class="start" onclick="startMatch()">${state.running?'ZÁPAS BĚŽÍ':'▶ SPUSTIT ŽIVÝ ZÁPAS'}</button></div></section><div>${panel('TAKTIKA',`<div style="padding:14px;display:flex;gap:7px"><button class="action-btn" onclick="tactic('defensive')">🛡 Obrana</button><button class="action-btn ghost" onclick="tactic('balanced')">⚖ Balanc</button><button class="action-btn" onclick="tactic('attacking')">🔥 Útok</button></div>`)}${panel('UDÁLOSTI',`<div style="padding:10px 15px">${state.events.length?state.events.slice().reverse().map(e=>`<div class="player"><span>${e}</span></div>`).join(''):'<div style="padding:15px;color:var(--muted)">Čekáme na první událost…</div>'}</div>`)}</div></div>`}
function render(){ $('side').innerHTML=navRender(); const p=state.page; $('main').innerHTML=p==='home'?home():p==='team'?team():p==='training'?training():p==='league'?league():p==='match'?match():p==='tactics'?simple('Taktika','Předzápasové nastavení a herní styl',[['HERNÍ STYL','VYVÁŽENÝ','','Stabilní poměr útoku a obrany.','Taktika uložena','ULOŽIT'],['FORECHECK','STŘEDNÍ','','Riziko vs. tlak v útočném pásmu.','Nastavení uloženo','ULOŽIT'],['TEMPO','NORMÁLNÍ','','Vyšší tempo zvyšuje šance i únavu.','Nastavení uloženo','ULOŽIT']]):p==='finance'?simple('Finance','Rozpočet, příjmy, výdaje a sponzoři',[['ZŮSTATEK','2 450 000 Kč','#38e58a','Aktuální klubová kasa.','Finance otevřeny','DETAIL'],['PŘÍJMY','+480 000 Kč','#38e58a','Vstupné, sponzoři a obchod.','Přehled příjmů','DETAIL'],['VÝDAJE','−320 000 Kč','#ff5d63','Mzdy, provoz a rozvoj.','Přehled výdajů','DETAIL']]):p==='stadium'?simple('Stadion','Kapacita, atmosféra, LED reklama a VIP sektory',[['VARGAN ARENA','Lv. 4','','Kapacita 8 500 • atmosféra 86.','Upgrade zahájen','VYLEPŠIT'],['LED PANELY','Lv. 3','','Více prostoru pro sponzory a zápasové efekty.','Upgrade zahájen','VYLEPŠIT'],['VIP SEKTOR','Lv. 2','','Vyšší příjem z prémiových fanoušků.','Upgrade zahájen','VYLEPŠIT']]):p==='scout'?simple('Scouting','Síť skautů a postupné odhalování potenciálu',[['MLADÝ TALENT','76 OVR','','Filip Marek • C • potenciál 88–92.','Přidán na seznam','SLEDOVAT'],['VOLNÝ HRÁČ','79 OVR','','Ondřej Koutný • G • odhad mzdy 68k.','Report objednán','SCOUT'],['SCOUTING SÍŤ','Lv. 3','','Česko, Slovensko a další regiony.','Síť rozšířena','ROZŠÍŘIT']]):p==='transfers'?simple('Přestupy','Transfer market, vyjednávání a kontrakty',[['LUKÁŠ BENEŠ','87 OVR','','LW • odhad ceny 4,2 mil. Kč.','Jednání zahájeno','VYJEDNÁVAT'],['JAN KOVÁŘ','84 OVR','','RD • odhad ceny 3,1 mil. Kč.','Jednání zahájeno','VYJEDNÁVAT'],['MAREK ZIMA','82 OVR','','C • odhad ceny 2,6 mil. Kč.','Jednání zahájeno','VYJEDNÁVAT']]):p==='facilities'?simple('Zařízení','Klubová základna a její fyzický růst',[['TRÉNINKOVÉ CENTRUM','Lv. 3','','Vývoj hráčů +8 %.','Upgrade zahájen','VYLEPŠIT'],['MEDICAL CENTRUM','Lv. 2','','Regenerace +5 % • méně zranění.','Upgrade zahájen','VYLEPŠIT'],['AKADEMIE','Lv. 3','','Lepší generace mladých talentů.','Upgrade zahájen','VYLEPŠIT']]):home(); }
function tactic(t){state.tactic=t;render()}
function startMatch(){if(state.running){toast('Zápas už běží');return}state.running=true;state.events.push('▶ Zápas začal. Vargan nastupuje doma.');render();state.timer=setInterval(()=>{state.sec++;if(state.sec===45)state.events.push('🏒 45′ Velká šance Varganu — brankář vyráží.');if(state.sec===90){state.home++;state.events.push('🥅 1:30 GÓL! Vargan otevírá skóre.')}if(state.sec===150)state.events.push('⚡ 2:30 Northfire zvyšuje tempo.');if(state.sec===210){state.away++;state.events.push('🥅 3:30 GÓL! Northfire srovnává.')}if(state.sec===100)state.period=2;if(state.sec===200)state.period=3;if(state.sec===300){state.running=false;clearInterval(state.timer);state.events.push('🏁 Konec zápasu.')}render()},1000)}
render();
</script>
</body>
</html>
